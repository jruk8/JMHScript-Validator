# Scary Sounds: per-player horror ambience for the Horror preset.
# One PER_EXECUTOR poll rolls two independent schedules: mood
# murmers on about every mood cadence, sudden stingers on about
# every sudden cadence. Each schedule reads one nested sounds
# list; each pick excludes the last-played sound id so nothing
# repeats back-to-back (a one-entry pool replays by necessity).
# When both rolls pass on one poll, mood wins and the sudden roll
# waits for the next poll. Volumes scale by the static mix
# multiplier. Silently activates: no broadcast, no color.
enabled: false
meta:
  name: "Scary Sounds"
  description: "Mood murmurs and sudden stingers per player (v1.0)"
  icon: SCULK_SHRIEKER
  author: DaVeltto
  visibility:
    icon: SCULK_SHRIEKER
    broadcast: false
config:
  settings:
    mood:
      def:
        meta:
          name: Mood
          desc: Slow murmur schedule and its sound table.
          icon: SCULK_SHRIEKER
        folder:
          - cadence:
              value: 20
              def:
                meta:
                  name: Cadence
                  desc: Average seconds between mood sounds.
                  icon: CLOCK
                value:
                  type: INTEGER
                  default: 20
                  allowed:
                    min: 5
                    max: 3600
          - deviation:
              value: 7
              def:
                meta:
                  name: Deviation
                  desc: Random spread in seconds around the cadence. Keep smaller than the cadence.
                  icon: CLOCK
                value:
                  type: INTEGER
                  default: 7
                  allowed:
                    min: 0
                    max: 600
          - sounds:
              value:
                - [true, ambient.crimson_forest.mood, 0.6, 0.9]
                - [true, ambient.underwater.loop.additions.rare, 0.6, 0.9]
                - [true, ambient.soul_sand_valley.mood, 0.6, 0.7]
                - [true, entity.boat.paddle_land, 0.4, 0.7]
                - [true, block.fire.ambient, 0.4, 0.7]
                - [true, entity.parrot.imitate.vex, 0.35, 0.65]
              def:
                meta:
                  name: Sounds
                  desc: Mood table as [enabled, sound, pitch, volume] rows.
                  icon: NOTE_BLOCK
                value:
                  type: LIST
                  default:
                    - [true, ambient.crimson_forest.mood, 0.6, 0.9]
                    - [true, ambient.underwater.loop.additions.rare, 0.6, 0.9]
                    - [true, ambient.soul_sand_valley.mood, 0.6, 0.7]
                    - [true, entity.boat.paddle_land, 0.4, 0.7]
                    - [true, block.fire.ambient, 0.4, 0.7]
                    - [true, entity.parrot.imitate.vex, 0.35, 0.65]
    sudden:
      def:
        meta:
          name: Sudden
          desc: Rare stinger schedule and its sound table.
          icon: CONDUIT
        folder:
          - cadence:
              value: 35
              def:
                meta:
                  name: Cadence
                  desc: Average seconds between sudden sounds.
                  icon: CLOCK
                value:
                  type: INTEGER
                  default: 35
                  allowed:
                    min: 5
                    max: 3600
          - deviation:
              value: 17
              def:
                meta:
                  name: Deviation
                  desc: Random spread in seconds around the cadence. Keep smaller than the cadence.
                  icon: CLOCK
                value:
                  type: INTEGER
                  default: 17
                  allowed:
                    min: 0
                    max: 600
          - sounds:
              value:
                - [true, block.azalea_leaves.fall, 0.4, 0.9]
                - [true, block.azalea_leaves.step, 0.4, 0.9]
                - [true, block.cherry_wood.fall, 0.4, 1.0]
                - [true, block.conduit.ambient.short, 0.4, 1.0]
                - [true, block.copper_bulb.turn_on, 0.4, 1.0]
                - [true, block.coral_block.hit, 0.4, 1.0]
                - [true, entity.generic.splash, 0.4, 0.9]
                - [true, entity.guardian.flop, 0.4, 1.0]
              def:
                meta:
                  name: Sounds
                  desc: Sudden table as [enabled, sound, pitch, volume] rows.
                  icon: CONDUIT
                value:
                  type: LIST
                  default:
                    - [true, block.azalea_leaves.fall, 0.4, 0.9]
                    - [true, block.azalea_leaves.step, 0.4, 0.9]
                    - [true, block.cherry_wood.fall, 0.4, 1.0]
                    - [true, block.conduit.ambient.short, 0.4, 1.0]
                    - [true, block.copper_bulb.turn_on, 0.4, 1.0]
                    - [true, block.coral_block.hit, 0.4, 1.0]
                    - [true, entity.generic.splash, 0.4, 0.9]
                    - [true, entity.guardian.flop, 0.4, 1.0]
    mix:
      def:
        meta:
          name: Mix
          desc: Global volume scaling.
          icon: NOTE_BLOCK
        folder:
          - multiplier:
              value: 0.45
              def:
                meta:
                  name: Multiplier
                  desc: Every volume scales by this.
                  icon: NOTE_BLOCK
                value:
                  type: DOUBLE
                  default: 0.45
                  allowed:
                    min: 0.0
                    max: 2.0
behavior:
  main:
    runs-on:
      - INTERVAL
    options:
      interval-settings:
        # Per-executor poll. The poll tick itself is fixed here (the
        # engine cannot drive options from settings); the mood and
        # sudden cadences above stay tunable.
        interval: 5
        deviation: 2.5
        behavior: PER_EXECUTOR
    commands:
      player:
        # Tunables live in config.settings above. Per-executor
        # memory rides pf flags: next-mood, next-sudden, last pick.
        # ---- Functions ----
        # schedm/scheds: next category hit = now + cadence spread.
        - '<def:schedm,<pf:scary-next-mood,<ceil:<lf:now>+<random-num:<lf:mlo>,<lf:mhi>>>>>'
        - '<def:scheds,<pf:scary-next-sudden,<ceil:<lf:now>+<random-num:<lf:slo>,<lf:shi>>>>>'
        # ---- Clock and windows ----
        - '<lf:now,<gstat:duration>>'
        - '<lf:mlo,<ceil:<setting:mood.cadence>-<setting:mood.deviation>>>'
        - '<lf:mhi,<ceil:<setting:mood.cadence>+<setting:mood.deviation>>>'
        - '<lf:slo,<ceil:<setting:sudden.cadence>-<setting:sudden.deviation>>>'
        - '<lf:shi,<ceil:<setting:sudden.cadence>+<setting:sudden.deviation>>>'
        - '<if:"<default:<pf:scary-next-mood>,none> == none","<schedm>">'
        - '<if:"<default:<pf:scary-next-sudden>,none> == none","<scheds>">'
        - '<lf:mdue,<if:"<lf:now> ge <default:<pf:scary-next-mood>,0>",true,false>>'
        - '<lf:sdue,<if:"<lf:now> ge <default:<pf:scary-next-sudden>,0>",true,false>>'
        # ---- Mood pool: enabled entries minus the last pick ----
        - '<lf:mfull,<list.filter:<setting:mood.sounds>,<if:"<list.get:<i>,0> == true",true,false>>>'
        - '<lf:mpool,<list.filter:<lf:mfull>,<if:"<list.get:<i>,1> != <default:<pf:scary-last>,none>",true,false>>>'
        - '<lf:mpool,<if:"<len:<lf:mpool>> == 0",<lf:mfull>,<lf:mpool>>>'
        - '<lf:mplay,<if:"<lf:mdue> == true and <len:<lf:mfull>> gt 0",true,false>>'
        - '<if:"<lf:mplay> == true","<lf:mpick,<random-pick:<lf:mpool>>>">'
        # Volume pre-extracts: math tags split quote-blind, so the
        # product needs plain operands, not a nested get.
        - '<if:"<lf:mplay> == true","<lf:mvol,<list.get:<lf:mpick>,3>>">'
        - '<if:"<lf:mplay> == true","<psound:<p>,[true,<list.get:<lf:mpick>,1>,<list.get:<lf:mpick>,2>,<max:<lf:mvol>*<setting:mix.multiplier>,0>]>>">'
        - '<if:"<lf:mplay> == true","<pf:scary-last,<list.get:<lf:mpick>,1>>">'
        - '<if:"<lf:mplay> == true","<schedm>">'
        # ---- Sudden pool: same shape, eight entries ----
        - '<lf:sfull,<list.filter:<setting:sudden.sounds>,<if:"<list.get:<i>,0> == true",true,false>>>'
        - '<lf:spool,<list.filter:<lf:sfull>,<if:"<list.get:<i>,1> != <default:<pf:scary-last>,none>",true,false>>>'
        - '<lf:spool,<if:"<len:<lf:spool>> == 0",<lf:sfull>,<lf:spool>>>'
        # Mood wins ties: a played mood holds the sudden roll for
        # the next poll (no reschedule, so it stays due).
        - '<lf:splay,<if:"<lf:sdue> == true and <lf:mplay> != true and <len:<lf:sfull>> gt 0",true,false>>'
        - '<if:"<lf:splay> == true","<lf:spick,<random-pick:<lf:spool>>>">'
        - '<if:"<lf:splay> == true","<lf:svol,<list.get:<lf:spick>,3>>">'
        - '<if:"<lf:splay> == true","<psound:<p>,[true,<list.get:<lf:spick>,1>,<list.get:<lf:spick>,2>,<max:<lf:svol>*<setting:mix.multiplier>,0>]>>">'
        - '<if:"<lf:splay> == true","<pf:scary-last,<list.get:<lf:spick>,1>>">'
        - '<if:"<lf:splay> == true","<scheds>">'
