# Swap ⇔: hunters and speedrunners trade places on a timer.
# One shared INTERVAL polls; targets are cached, validated every poll, and paired at swap time.
# Needs <pteleport> and array-style sound/message args: [enabled, id, pitch, volume] / [enabled, text].
enabled: false
meta:
  name: "Swap ⇔"
  description: "Hunters and runners swap places (v1.0)"
  icon: ENDER_PEARL
  author: jruk
  visibility:
    icon: ENDER_PEARL
    color: 3495eb
    broadcast: true
config:
  settings:
    timing:
      def:
        meta:
          name: Timing
          desc: Swap cadence, spread, and warning window.
          icon: CLOCK
        folder:
          - swap_interval:
              value: 240
              def:
                meta:
                  name: Swap Interval
                  desc: Average seconds between swaps, with a random plus or minus spread.
                  icon: CLOCK
                value:
                  type: INTEGER
                  default: 240
                  allowed:
                    min: 5
                    max: 3600
          - deviation:
              value: 45
              def:
                meta:
                  name: Deviation
                  desc: Random spread in seconds around the swap interval. Keep smaller than the interval.
                  icon: CLOCK
                value:
                  type: INTEGER
                  default: 45
                  allowed:
                    min: 0
                    max: 600
          - warn_time:
              value: 20
              def:
                meta:
                  name: Warn Time
                  desc: Warning window in seconds before a swap.
                  icon: BELL
                value:
                  type: INTEGER
                  default: 20
                  allowed:
                    min: 0
                    max: 600
    messages:
      def:
        meta:
          name: Messages
          desc: Message toggles and sounds.
          icon: BELL
        folder:
          - warn_message:
              value: true
              def:
                meta:
                  name: Warn Message
                  desc: Warning message, also used by the cancel notice.
                  icon: PAPER
                value:
                  type: BOOLEAN
                  default: true
          - warn_sound:
              value: [true, item.spyglass.use, 0.8, 0.85]
              def:
                meta:
                  name: Warn Sound
                  desc: Warning sound, also used by the cancel notice.
                  icon: SPYGLASS
                value:
                  type: SOUND
                  default: [true, item.spyglass.use, 0.8, 0.85]
          - cancel_message:
              value: true
              def:
                meta:
                  name: Cancel Message
                  desc: Cancel notice message.
                  icon: PAPER
                value:
                  type: BOOLEAN
                  default: true
          - swap_message:
              value: true
              def:
                meta:
                  name: Swap Message
                  desc: Swap message to both players.
                  icon: PAPER
                value:
                  type: BOOLEAN
                  default: true
          - swap_sound:
              value: [true, block.copper_chest.close, 0.8, 0.9]
              def:
                meta:
                  name: Swap Sound
                  desc: Swap sound to both players.
                  icon: ENDER_PEARL
                value:
                  type: SOUND
                  default: [true, block.copper_chest.close, 0.8, 0.9]
behavior:
  main:
    runs-on:
      - INTERVAL
    options:
      interval-settings:
        # Poll rate in seconds. The countdown message only fires on polls,
        # so it can be a bit off; a higher value is cheaper.
        interval: 2
        behavior: PER_INVOKE
    commands:
      console:
        # Tunables live in config.settings above. Messages are on/off.
        # Sounds are [enabled, id, pitch, volume].
        # ---- Functions ----
        # schedule(from): next swap time = from + interval +/- deviation,
        # and a fresh warned list for the round.
        - '<def:schedule,<gf:swap-next,<ceil:from+<random-num:<lf:lo>,<lf:hi>>>><gf:swap-warned,[]>,from>'
        # warn(who): one-time warning (real seconds left) for a selected
        # player, then records them as warned for this round.
        - '<def:warn,<pmsg:who,[<setting:messages.warn_message>,You will \<bold\>swap ⇔\</bold\> in the next \<white\><ceil:<lf:rem>>\</white\> seconds.]><psound:who,<setting:messages.warn_sound>><list.append:<gf:swap-warned>,who>,who>'
        # cancel(who): tell a warned player their swap is off, and forget
        # their warning so a later re-selection warns them again.
        - '<def:cancel,<pmsg:who,[<setting:messages.cancel_message>,Your \<bold\>swap ⇔\</bold\> was cancelled!]><psound:who,<setting:messages.warn_sound>><list.remove:<gf:swap-warned>,who>,who>'
        # swap_pair(ix): teleport the ix-th hunter and runner to each other's
        # captured spot (shl/srl, parallel to sh/sr), then message and sound
        # both. Single param on purpose: names come from the lists.
        - '<def:swap_pair,<pteleport:<list.get:<lf:sh>,ix>,<list.get:<lf:srl>,ix>><pteleport:<list.get:<lf:sr>,ix>,<list.get:<lf:shl>,ix>><pmsg:<list.get:<lf:sh>,ix>,[<setting:messages.swap_message>,You swapped places with \<white\><list.get:<lf:sr>,ix>\</white\>!]><pmsg:<list.get:<lf:sr>,ix>,[<setting:messages.swap_message>,You swapped places with \<white\><list.get:<lf:sh>,ix>\</white\>!]><psound:<list.get:<lf:sh>,ix>,<setting:messages.swap_sound>><psound:<list.get:<lf:sr>,ix>,<setting:messages.swap_sound>>,ix>'
        # ---- Timer ----
        - '<lf:now,<gstat:duration>>'
        - '<lf:lo,<ceil:<setting:timing.swap_interval>-<setting:timing.deviation>>>'
        - '<lf:hi,<ceil:<setting:timing.swap_interval>+<setting:timing.deviation>>>'
        # First poll of the match: schedule the first swap.
        - '<if:"<default:<gf:swap-next>,none> == none","<schedule:<lf:now>>">'
        # ---- Eligible players and pair count ----
        - '<lf:ah,<active-players:HUNTER>>'
        - '<lf:ar,<active-players:SPEEDRUNNER>>'
        # One side may be bigger: only k players per side swap.
        - '<lf:k,<min:<len:<lf:ah>>,<len:<lf:ar>>>>'
        # No pairs possible: discard the round. Warned players still online
        # get the cancel notice, state is wiped, and the countdown restarts
        # at the first poll where pairs exist again.
        - '<lf:wl,<default:<gf:swap-warned>,[]>>'
        - '<if:"<lf:k> == 0","<for:<lf:wl>,<if:''<list.contains:<lf:ah>,<i>> == true or <list.contains:<lf:ar>,<i>> == true'',''<cancel:<i>>''>>">'
        - '<if:"<lf:k> == 0","<gf:swap-sel-h,[]>">'
        - '<if:"<lf:k> == 0","<gf:swap-sel-r,[]>">'
        - '<if:"<lf:k> == 0","<gf:swap-warned,[]>">'
        - '<if:"<lf:k> == 0","<gf:swap-next,none>">'
        - '<if:"<lf:k> == 0","exit">'
        # ---- Target cache: load, validate, trim ----
        - '<lf:sh,<default:<gf:swap-sel-h>,[]>>'
        - '<lf:sr,<default:<gf:swap-sel-r>,[]>>'
        # Drop anyone who is no longer eligible.
        - '<lf:sh,<list.filter:<lf:sh>,<list.contains:<lf:ah>,<i>>>>'
        - '<lf:sr,<list.filter:<lf:sr>,<list.contains:<lf:ar>,<i>>>>'
        # Players beyond k on the bigger side lose their slot (4v4 to 3v4).
        - '<lf:dh,<list.slice:<lf:sh>,<lf:k>,<len:<lf:sh>>>>'
        - '<lf:dr,<list.slice:<lf:sr>,<lf:k>,<len:<lf:sr>>>>'
        # Trim to k, then tell dropped players their swap was cancelled, but
        # only if they were already warned. Leavers replaced by a new random
        # pick (top-up below) are silent: the swap is not cancelled.
        - '<lf:sh,<list.slice:<lf:sh>,0,<lf:k>>>'
        - '<lf:sr,<list.slice:<lf:sr>,0,<lf:k>>>'
        - '<for:<lf:dh>,<if:''<list.contains:<gf:swap-warned>,<i>> == true'',''<cancel:<i>>''>>'
        - '<for:<lf:dr>,<if:''<list.contains:<gf:swap-warned>,<i>> == true'',''<cancel:<i>>''>>'
        # Shuffle the eligible lists in place, only when a pick or top-up
        # is needed (shuffle on a flag reference writes back and returns
        # nothing, so it gets its own line).
        - '<if:"<len:<lf:sh>> lt <lf:k>","<list.shuffle:<lf:ah>>">'
        - '<if:"<len:<lf:sr>> lt <lf:k>","<list.shuffle:<lf:ar>>">'
        # Empty cache: pick k random players per side.
        - '<if:"<len:<lf:sh>> == 0","<lf:sh,<list.slice:<lf:ah>,0,<lf:k>>>">'
        - '<if:"<len:<lf:sr>> == 0","<lf:sr,<list.slice:<lf:ar>,0,<lf:k>>>">'
        # Short cache (a leaver was removed): silently top up from
        # players not yet selected.
        - '<if:"<len:<lf:sh>> lt <lf:k>","<for:<lf:ah>,<if:''<len:<lf:sh>> lt <lf:k> and <list.contains:<lf:sh>,<i>> != true'',''<list.append:<lf:sh>,<i>>''>>">'
        - '<if:"<len:<lf:sr>> lt <lf:k>","<for:<lf:ar>,<if:''<len:<lf:sr>> lt <lf:k> and <list.contains:<lf:sr>,<i>> != true'',''<list.append:<lf:sr>,<i>>''>>">'
        # Store the validated cache.
        - '<gf:swap-sel-h,<lf:sh>>'
        - '<gf:swap-sel-r,<lf:sr>>'
        # ---- Countdown ----
        # Seconds left, never below 0.
        - '<lf:rem,<max:<gf:swap-next>-<lf:now>,0>>'
        # Only selected players get the warning, once each per round.
        - '<if:"<lf:rem> gt 0 and <lf:rem> le <setting:timing.warn_time>","<for:<lf:sh>,<if:''<list.contains:<gf:swap-warned>,<i>> != true'',''<warn:<i>>''>>">'
        - '<if:"<lf:rem> gt 0 and <lf:rem> le <setting:timing.warn_time>","<for:<lf:sr>,<if:''<list.contains:<gf:swap-warned>,<i>> != true'',''<warn:<i>>''>>">'
        # ---- Swap ----
        # Pairings are made now: shuffle the runner side, then pair by index.
        - '<if:"<lf:rem> le 0","<list.shuffle:<lf:sr>>">'
        # Capture every selected player's spot (x y z world pitch yaw,
        # facing swaps too) first, so a teleport can never change what
        # its pair reads.
        - '<if:"<lf:rem> le 0","<lf:shl,[]>">'
        - '<if:"<lf:rem> le 0","<lf:srl,[]>">'
        - '<if:"<lf:rem> le 0","<for:<lf:sh>,<list.append:<lf:shl>,<ploc:<i>>>>">'
        - '<if:"<lf:rem> le 0","<for:<lf:sr>,<list.append:<lf:srl>,<ploc:<i>>>>">'
        # Swap by index; a pair is skipped if either location is missing.
        - '<if:"<lf:rem> le 0 and <lf:k> gt 0","<for:<range:<lf:k>>,<if:''<list.get:<lf:shl>,<i>> != null and <list.get:<lf:srl>,<i>> != null'',''<swap_pair:<i>>''>>">'
        # Done: erase the cache (new targets are picked on the next poll)
        # and schedule the next swap.
        - '<if:"<lf:rem> le 0","<gf:swap-sel-h,[]>">'
        - '<if:"<lf:rem> le 0","<gf:swap-sel-r,[]>">'
        - '<if:"<lf:rem> le 0","<schedule:<lf:now>>">'