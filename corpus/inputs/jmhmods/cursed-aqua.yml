# Cursed Aqua 🧪: standing in water burns (wither + blindness) until you get out.
# One shared INTERVAL polls everyone; the acidic warning is global (match clock).
enabled: false
meta:
  name: "Cursed Aqua 🧪"
  description: "Standing water is acidic and kills (v1.0)"
  icon: POTION
  author: DaVeltto
  visibility:
    icon: POTION
    color: 97e148
    broadcast: true
config:
  settings:
    info_message:
      value: true
      def:
        meta:
          name: Info Message
          desc: First poll info line.
          icon: PAPER
        value:
          type: BOOLEAN
          default: true
    info_sound:
      value: [true, item.nautilus_saddle_underwater_equip, 1.3, 0.6]
      def:
        meta:
          name: Info Sound
          desc: First poll info sound.
          icon: SADDLE
        value:
          type: SOUND
          default: [true, item.nautilus_saddle_underwater_equip, 1.3, 0.6]
    effect_list:
      value: [[wither, 2, 1], [blindness, 0, 3]]
      def:
        meta:
          name: Effect List
          desc: Acid effects as id, amplifier, seconds triples. Ids stay bare.
          icon: GLASS_BOTTLE
        value:
          type: EFFECTS
          default: [[wither, 2, 1], [blindness, 0, 3]]
    neutralize_water_breathing:
      value: true
      def:
        meta:
          name: Neutralize Water Breathing
          desc: Water breathing skips the acid while held.
          icon: PUFFERFISH
        value:
          type: BOOLEAN
          default: true
    warn_message:
      value: true
      def:
        meta:
          name: Warn Message
          desc: Standing in acidic water message, at most once per 5 seconds.
          icon: PAPER
        value:
          type: BOOLEAN
          default: true
    warn_sound:
      value: [true, entity.wither_skeleton.hurt, 0.8, 0.8]
      def:
        meta:
          name: Warn Sound
          desc: Standing in acidic water sound.
          icon: BONE
        value:
          type: SOUND
          default: [true, entity.wither_skeleton.hurt, 0.8, 0.8]
behavior:
  main:
    # One shared poll; wet players burn, dry players walk free.
    runs-on:
      - INTERVAL
    options:
      interval-settings:
        interval: 0.5
        behavior: PER_INVOKE
    commands:
      console:
        # Tunables live in config.settings above.
        # ---- First poll info ----
        - '<lf:info_go,<if:"<default:<gf:aqua-info>,none> == none",true,false>>'
        - '<if:"<lf:info_go> == true","<gmsg:[<setting:info_message>,The water is \<bold\>acidic\</bold\> and kills!]>">'
        - '<if:"<lf:info_go> == true","<gsound:<setting:info_sound>>">'
        - '<if:"<lf:info_go> == true","<gf:aqua-info,true>">'
      player:
        # Acid tunables come from the shared config.settings above.
        # ---- Acid check ----
        # Dry feet: walk free.
        - '<lf:wet,<if:"<pblock:<p>,feet> == water",true,false>>'
        - '<if:"<lf:wet> != true","exit">'
        # Breathing players walk free while the toggle holds.
        - '<if:"<setting:neutralize_water_breathing> == true and <phaseffect:<p>,water_breathing> == true","exit">'
        # Wet feet: burn, reapplied every poll.
        - '<peffect:<p>,<setting:effect_list>>'
        # Notices go out at most once per 5 seconds per player,
        # shared by message and sound.
        - '<lf:notice,<pcooldown:<p>,aqua-<id>,5>>'
        - '<if:"<lf:notice> == true","<pmsg:<p>,[<setting:warn_message>,Acidic water! Get out!]>">'
        - '<if:"<lf:notice> == true","<psound:<p>,<setting:warn_sound>>">'