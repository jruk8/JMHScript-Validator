# Lifesteal 💔: killing a player steals max health from them.
# Main handles deaths; the engine announces the mod at start.
enabled: false
meta:
  name: "Lifesteal 💔"
  description: "Steal max health from players you kill (v1.0)"
  icon: GHAST_TEAR
  author: DaVeltto
  visibility:
    icon: GHAST_TEAR
    color: d42f63
    broadcast: true
config:
  settings:
    steal:
      def:
        meta:
          name: Steal
          desc: Stolen amount and which deaths count.
          icon: HEART_OF_THE_SEA
        folder:
          - amount:
              value: 4
              def:
                meta:
                  name: Amount
                  desc: Max health stolen per death in half-hearts. 4 is two hearts.
                  icon: GHAST_TEAR
                value:
                  type: INTEGER
                  default: 4
                  allowed:
                    min: 1
                    max: 40
          - also_natural:
              value: false
              def:
                meta:
                  name: Also Natural
                  desc: True makes deaths with no killer also cost max health (nobody gains it).
                  icon: BONE
                value:
                  type: BOOLEAN
                  default: false
          - also_friendly_fire:
              value: true
              def:
                meta:
                  name: Also Friendly Fire
                  desc: True transfers health on teammate kills; false transfers nothing and the victim only loses health when natural losses are on.
                  icon: IRON_SWORD
                value:
                  type: BOOLEAN
                  default: true
    messages:
      def:
        meta:
          name: Messages
          desc: Message toggle and sounds.
          icon: BELL
        folder:
          - messages:
              value: true
              def:
                meta:
                  name: Messages
                  desc: Master toggle for all lifesteal messages.
                  icon: PAPER
                value:
                  type: BOOLEAN
                  default: true
          - steal_sound:
              value: [true, block.amethyst_block.hit, 1.2, 1.0]
              def:
                meta:
                  name: Steal Sound
                  desc: Killer gains health sound.
                  icon: AMETHYST_SHARD
                value:
                  type: SOUND
                  default: [true, block.amethyst_block.hit, 1.2, 1.0]
          - lose_sound:
              value: [true, entity.zombie_nautilus.dash_ready, 0.9, 0.75]
              def:
                meta:
                  name: Lose Sound
                  desc: Victim loses health but survives sound.
                  icon: NAUTILUS_SHELL
                value:
                  type: SOUND
                  default: [true, entity.zombie_nautilus.dash_ready, 0.9, 0.75]
          - final_sound:
              value: [true, entity.zombie_nautilus.dash_ready_land, 1.0, 0.7]
              def:
                meta:
                  name: Final Sound
                  desc: Victim eliminated by the loss sound.
                  icon: TOTEM_OF_UNDYING
                value:
                  type: SOUND
                  default: [true, entity.zombie_nautilus.dash_ready_land, 1.0, 0.7]
behavior:
  main:
    runs-on:
      - ON_DEATH
    commands:
      console:
        # Tunables live in config.settings above. Messages on/off.
        # Sounds are [enabled, id, pitch, volume].
        # ---- Functions ----
        # capped(mh): the amount actually taken, limited to the victim's
        # max health. pstat reads -1 for an eliminated player, so then the
        # full amount is used.
        - '<def:capped,<if:mh lt 0,<setting:steal.amount>,<min:<setting:steal.amount>,mh>>,mh>'
        # ---- Who is involved ----
        - '<lf:victim,<args:0>>'
        - '<lf:killer,<args:1>>'
        # A transfer needs a killer who is still in the match.
        - '<lf:transfer,<if:"<lf:killer> != null and <peliminated:<lf:killer>> != true",true,false>>'
        # Teammate kill: transfer only when friendly fire is on.
        - '<lf:friendly,<if:"<lf:transfer> == true and <prole:<lf:killer>> == <args:2>",true,false>>'
        - '<if:"<lf:friendly> == true and <setting:steal.also_friendly_fire> != true","<lf:transfer,false>">'
        # No transfer and natural losses off: nothing happens.
        - '<lf:lose,<if:"<lf:transfer> == true or <setting:steal.also_natural> == true",true,false>>'
        - '<if:"<lf:lose> != true","exit">'
        # ---- Apply ----
        - '<lf:taken,<capped:<pstat:<lf:victim>,max-health>>>'
        # Remember whether they were already out before the loss.
        - '<lf:was_out,<peliminated:<lf:victim>>>'
        - '<pmaxhp.modify:<lf:victim>,<id>,-<lf:taken>>'
        - '<if:"<lf:transfer> == true","<pmaxhp.modify:<lf:killer>,<id>,<lf:taken>>">'
        # Final loss: the max health loss itself eliminated them.
        - '<lf:final,<if:"<lf:was_out> != true and <peliminated:<lf:victim>> == true",true,false>>'
        # ---- Messages ----
        - '<if:"<lf:transfer> == true","<pmsg:<lf:killer>,[<setting:messages.messages>,You stole health from \<white\><lf:victim>\</white\>!]>">'
        - '<if:"<lf:transfer> == true and <lf:final> != true","<pmsg:<lf:victim>,[<setting:messages.messages>,\<white\><lf:killer>\</white\> stole health from you!]>">'
        - '<if:"<lf:transfer> == true and <lf:final> == true","<pmsg:<lf:victim>,[<setting:messages.messages>,\<white\><lf:killer>\</white\> stole your final hearts!]>">'
        # Nobody gains (natural death or teammate kill without transfer).
        - '<if:"<lf:transfer> != true and <lf:final> != true","<pmsg:<lf:victim>,[<setting:messages.messages>,You lost health!]>">'
        - '<if:"<lf:transfer> != true and <lf:final> == true","<pmsg:<lf:victim>,[<setting:messages.messages>,You lost your final hearts!]>">'
        # ---- Sounds ----
        - '<if:"<lf:transfer> == true","<psound:<lf:killer>,<setting:messages.steal_sound>>">'
        - '<if:"<lf:final> != true","<psound:<lf:victim>,<setting:messages.lose_sound>>">'
        - '<if:"<lf:final> == true","<psound:<lf:victim>,<setting:messages.final_sound>>">'
      player-cleanup:
        # Drop this modifier's max health contribution when the match ends.
        - "<pmaxhp.clear:<p>,<id>>"