# Huddle for Warmth: a player with no teammate within radius gets effects
# (wither by default) until they regroup. Team picks the side.
enabled: false
meta:
  name: "Huddle for Warmth"
  description: "Lonely players wither until they regroup; Team picks the side (v2.0)"
  icon: SOUL_CAMPFIRE
  author: DaVeltto
  visibility:
    icon: SOUL_CAMPFIRE
    color: e8671c
    broadcast: true
config:
  settings:
    team:
      def:
        meta:
          name: Team
          desc: Which side this modifier affects.
          icon: SHIELD
        folder:
          - affected_team:
              value: BOTH
              def:
                meta:
                  name: Affected Team
                  desc: RUNNER hits speedrunners, HUNTER hits hunters, BOTH hits everyone.
                  icon: SHIELD
                value:
                  type: ENUM
                  default: BOTH
                  allowed: [BOTH, RUNNER, HUNTER]
    huddle:
      def:
        meta:
          name: Huddle
          desc: Cozy radius and punishment effects.
          icon: CAMPFIRE
        folder:
          - radius:
              value: 21
              def:
                meta:
                  name: Radius
                  desc: Cozy radius in blocks.
                  icon: COMPASS
                value:
                  type: INTEGER
                  default: 21
                  allowed:
                    min: 1
                    max: 500
          - effect_list:
              value: [[wither, 2, 2]]
              def:
                meta:
                  name: Effect List
                  desc: Punishment effects as id, amplifier, seconds triples. Ids stay bare.
                  icon: GLASS_BOTTLE
                value:
                  type: EFFECTS
                  default: [[wither, 2, 2]]
          - glow_seconds:
              value: 3
              def:
                meta:
                  name: Glow Seconds
                  desc: Glow refreshed on the cold player and their warm nearest mate each poll.
                  icon: TORCH
                value:
                  type: INTEGER
                  default: 3
                  allowed:
                    min: 0
                    max: 3600
    messages:
      def:
        meta:
          name: Messages
          desc: Message toggles and sounds.
          icon: BELL
        folder:
          - cold_message:
              value: true
              def:
                meta:
                  name: Cold Message
                  desc: Punished player message.
                  icon: PAPER
                value:
                  type: BOOLEAN
                  default: true
          - cold_sound:
              value: [true, entity.zombie.hurt, 0.6, 1.0]
              def:
                meta:
                  name: Cold Sound
                  desc: Punished player sound.
                  icon: ROTTEN_FLESH
                value:
                  type: SOUND
                  default: [true, entity.zombie.hurt, 0.6, 1.0]
          - alert_message:
              value: true
              def:
                meta:
                  name: Alert Message
                  desc: Closest warm mate is told someone needs company.
                  icon: BELL
                value:
                  type: BOOLEAN
                  default: true
behavior:
  main:
    runs-on:
      - INTERVAL
    options:
      interval-settings:
        interval: 2.5
        behavior: PER_INVOKE
    commands:
      player:
        # Team gate: RUNNER reads the SPEEDRUNNER side. One branch fires,
        # then the shared block below does the work.
        # BOTH means both TEAMS, never spectators: the null guard below keeps
        # null-prole executors out (old speedrunner:/hunter: lists never ran
        # for them, and <active-players:null> would warn every poll).
        - '<lf:mine,<prole:<p>>>'
        - '<lf:wanted,<setting:team.affected_team>>'
        - '<lf:hit,<if:"<lf:wanted> == BOTH and <lf:mine> != null",true,false>>'
        - '<if:"<lf:wanted> == RUNNER and <lf:mine> == SPEEDRUNNER","<lf:hit,true>">'
        - '<if:"<lf:wanted> == HUNTER and <lf:mine> == HUNTER","<lf:hit,true>">'
        - '<if:"<lf:hit> == true","<runblock:logic>">'
  logic:
    # Called-only: same executor (<p>) and same interval args (<args:0>)
    # as the caller; one-part <runblock:logic> inherits both. Local flags
    # and <def:> functions do not cross the hop, so everything below
    # re-derives from <p>, <args:0>, and <setting:...>.
    commands:
      player:
        # Tunables live in config.settings above. Messages are on/off.
        # Sounds are [enabled, id, pitch, volume].
        # Lonely player gets punished:
        # Closest mate is told someone needs company (only if they are warm):
        # ---- Mates ----
        # Everyone eligible on this side. One (or none) has nobody to huddle with.
        - "<lf:team,<active-players:<prole:<p>>>>"
        - '<if:"<len:<lf:team>> le 1","exit">'
        # Gaps are compared squared (vec.sqrdist skips the square root), so
        # the radius is squared once here.
        - "<lf:radius_sq,<max:<setting:huddle.radius>*<setting:huddle.radius>,0>>"
        # My spot, closest gap so far (squared), and who holds it.
        - "<lf:me,<ploc:<p>>>"
        - "<lf:best,999999999999>"
        - "<lf:nearest,nobody>"
        # Same-dimension mates only: across dimensions nobody is cozy.
        - "<lf:mates,[]>"
        - '<for:<lf:team>,<if:"<i> != <p> and <pworld:<i>> == <pworld:<p>>","<list.append:<lf:mates>,<i>>">>'
        # Closest mate's gap.
        - '<for:<lf:mates>,<if:"<vec.sqrdist:<lf:me>,<ploc:<i>>> lt <lf:best>","<lf:best,<vec.sqrdist:<lf:me>,<ploc:<i>>>><lf:nearest,<i>>">>'
        # Within radius of someone: walk free.
        - '<if:"<lf:best> le <lf:radius_sq>","exit">'
        # ---- Cold: punish and tell me ----
        - '<peffect:<p>,<setting:huddle.effect_list>>'
        # Cold players glow so mates can spot them.
        - '<peffect:<p>,[[glowing, 0,<setting:huddle.glow_seconds>]]>'
        # Notices go out at most once per 8 seconds per player,
        # shared by both messages.
        - '<lf:notice,<pcooldown:<p>,warmth-<id>,8>>'
        - '<if:"<lf:notice> == true","<pmsg:<p>,[<setting:messages.cold_message>,Huddle for warmth!]>">'
        - '<if:"<lf:notice> == true","<psound:<p>,<setting:messages.cold_sound>>">'
        # ---- Alert the closest mate ----
        # Nobody to alert.
        - '<if:"<lf:nearest> == nobody","exit">'
        # Their own closest gap (same dimension as them).
        - "<lf:nbest,999999999999>"
        - '<for:<lf:team>,<if:"<i> != <lf:nearest> and <pworld:<i>> == <pworld:<lf:nearest>> and <vec.sqrdist:<ploc:<lf:nearest>>,<ploc:<i>>> lt <lf:nbest>","<lf:nbest,<vec.sqrdist:<ploc:<lf:nearest>>,<ploc:<i>>>>">>'
        # They are cold too: they get their own message, skip the duplicate.
        - '<if:"<lf:nbest> gt <lf:radius_sq>","exit">'
        # Warm nearest glows too so the cold player can find them.
        # Cold nearests skip this: their own poll glows them.
        - '<peffect:<lf:nearest>,[[glowing, 0,<setting:huddle.glow_seconds>]]>'
        # They are warm: let them know someone needs company.
        - '<if:"<lf:notice> == true","<pmsg:<lf:nearest>,[<setting:messages.alert_message>,\<white\><p>\</white\> needs warmth!]>">'