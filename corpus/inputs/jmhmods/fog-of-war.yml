# Fog of War 🌫: everyone is blinded forever, at start and on every respawn.
# Main inflicts the fog; the engine announces the mod at start.
enabled: false
meta:
  name: "Fog of War 🌫"
  description: "Infinite blindness at start and on respawn (v1.0)"
  icon: INK_SAC
  author: DaVeltto
  visibility:
    icon: INK_SAC
    color: 4b4f57
    broadcast: true
config:
  settings:
    effect_list:
      value: [[blindness, 0, -1]]
      def:
        meta:
          name: Effect List
          desc: Fog effects as id, amplifier, seconds triples; -1 runs forever.
          icon: GLASS_BOTTLE
        value:
          type: EFFECTS
          default: [[blindness, 0, -1]]
    inflict_message:
      value: true
      def:
        meta:
          name: Inflict Message
          desc: Inflict message.
          icon: PAPER
        value:
          type: BOOLEAN
          default: true
    inflict_sound:
      value: [true, entity.breeze.wind_burst, 0.5, 0.45]
      def:
        meta:
          name: Inflict Sound
          desc: Inflict sound.
          icon: WIND_CHARGE
        value:
          type: SOUND
          default: [true, entity.breeze.wind_burst, 0.5, 0.45]
behavior:
  main:
    # Fog: inflict at start (after the pre-start window) and on respawn.
    runs-on:
      - ON_START
      - ON_RESPAWN
    on-start:
      pre-start-order: AFTER
    commands:
      player:
        # Tunables live in config.settings above. Sounds are
        # [enabled, id, pitch, volume].
        # ---- Logic ----
        - '<peffect:<p>,<setting:effect_list>>'
        - '<pmsg:<p>,[<setting:inflict_message>,The fog has fallen...]>'
        - '<psound:<p>,<setting:inflict_sound>>'
