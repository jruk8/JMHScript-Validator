# Spyglass Sniper: scope a spyglass and hold it on an enemy to lock, then resolve by damage or kill.
# Polls players on one shared INTERVAL; lock progress is per sniper, the target queue is shared.
enabled: false
meta:
  name: "Spyglass Sniper"
  description: "Hold a scoped spyglass on enemies to lock on and snipe them (v1.0)"
  icon: SPYGLASS
  author: DaVeltto
  visibility:
    icon: SPYGLASS
    color: c47f2a
    broadcast: true
config:
  settings:
    sniper:
      def:
        meta:
          name: Sniper
          desc: Lock timing, range, leniency, and outcome.
          icon: SPYGLASS
        folder:
          - lock_time:
              value: 3.0
              def:
                meta:
                  name: Lock Time
                  desc: Seconds of steady aim to complete a lock.
                  icon: CLOCK
                value:
                  type: DOUBLE
                  default: 3.0
                  allowed:
                    min: 0.25
                    max: 30.0
          - min_distance:
              value: 15
              def:
                meta:
                  name: Min Distance
                  desc: Closest range in blocks a lock can start or hold.
                  icon: COMPASS
                value:
                  type: INTEGER
                  default: 15
                  allowed:
                    min: 1
                    max: 100
          - leniency:
              # Computed ceiling 9.2 (spyglass 7deg cone); capped at 9.
              value: 1.5
              def:
                meta:
                  name: Leniency
                  desc: Aim slack in half-heads; 1.5 forgives about half a head each way.
                  icon: CROSSBOW
                value:
                  type: DOUBLE
                  default: 1.5
                  allowed:
                    min: 0.5
                    max: 9
          - outcome:
              value: DAMAGE
              def:
                meta:
                  name: Outcome
                  desc: DAMAGE wounds the target, KILL finishes them.
                  icon: IRON_SWORD
                value:
                  type: ENUM
                  default: DAMAGE
                  allowed: [DAMAGE, KILL]
          - damage_amount:
              value: 10.0
              def:
                meta:
                  name: Damage Amount
                  desc: Health dealt on a DAMAGE lock (10 is half of 20).
                  icon: ARROW
                value:
                  type: DOUBLE
                  default: 10.0
                  allowed:
                    min: 1.0
                    max: 100.0
          - warn_target:
              value: true
              def:
                meta:
                  name: Warn Target
                  desc: Tell targets they are being locked onto.
                  icon: BELL
                value:
                  type: BOOLEAN
                  default: true
          - show_sniper_name:
              value: true
              def:
                meta:
                  name: Show Sniper Name
                  desc: Name the sniper in the target warning.
                  icon: NAME_TAG
                value:
                  type: BOOLEAN
                  default: true
          - glow:
              value: true
              def:
                meta:
                  name: Glow
                  desc: Light targets up while they are tracked (never cleared).
                  icon: GLOW_INK_SAC
                value:
                  type: BOOLEAN
                  default: true
    messages:
      def:
        meta:
          name: Messages
          desc: Message toggles; sounds live in the Sounds folder.
          icon: PAPER
        folder:
          - locked_message:
              value: true
              def:
                meta:
                  name: Locked Message
                  desc: Sniper notice on acquiring a target.
                  icon: PAPER
                value:
                  type: BOOLEAN
                  default: true
          - fail_message:
              value: true
              def:
                meta:
                  name: Fail Message
                  desc: Sniper notice on losing a lock.
                  icon: PAPER
                value:
                  type: BOOLEAN
                  default: true
          - snipe_damage_message:
              value: true
              def:
                meta:
                  name: Snipe Damage Message
                  desc: Sniper notice on a damaging hit.
                  icon: PAPER
                value:
                  type: BOOLEAN
                  default: true
          - snipe_kill_message:
              value: true
              def:
                meta:
                  name: Snipe Kill Message
                  desc: Sniper notice on a finishing hit.
                  icon: PAPER
                value:
                  type: BOOLEAN
                  default: true
          - warn_message:
              value: true
              def:
                meta:
                  name: Warn Message
                  desc: Target-side lock warning.
                  icon: PAPER
                value:
                  type: BOOLEAN
                  default: true
          - cooldown_message:
              value: true
              def:
                meta:
                  name: Cooldown Message
                  desc: Reloading wait notice with seconds left.
                  icon: PAPER
                value:
                  type: BOOLEAN
                  default: true
    sounds:
      def:
        meta:
          name: Sounds
          desc: Sound cues as [enabled, id, pitch, volume].
          icon: NOTE_BLOCK
        folder:
          - locked_sound:
              value: [true, item.crossbow.shoot, 1.4, 0.9]
              def:
                meta:
                  name: Locked Sound
                  desc: Sniper cue on acquiring a target.
                  icon: CROSSBOW
                value:
                  type: SOUND
                  default: [true, item.crossbow.shoot, 1.4, 0.9]
          - fail_sound:
              value: [true, item.crossbow.loading_end, 1.9, 1.0]
              def:
                meta:
                  name: Fail Sound
                  desc: Sniper cue on losing a lock.
                  icon: BOW
                value:
                  type: SOUND
                  default: [true, item.crossbow.loading_end, 1.9, 1.0]
          - snipe_damage_sound:
              value: [true, block.cactus_flower.place, 0.9, 1.0]
              def:
                meta:
                  name: Snipe Damage Sound
                  desc: Sniper cue on a damaging hit.
                  icon: ARROW
                value:
                  type: SOUND
                  default: [true, block.cactus_flower.place, 0.9, 1.0]
          - snipe_kill_sound:
              value: [true, entity.camel_husk.sit, 1.4, 0.9]
              def:
                meta:
                  name: Snipe Kill Sound
                  desc: Sniper cue on a finishing hit.
                  icon: SKELETON_SKULL
                value:
                  type: SOUND
                  default: [true, entity.camel_husk.sit, 1.4, 0.9]
          - warn_sound:
              value: [true, block.big_dripleaf.place, 0.6, 1.0]
              def:
                meta:
                  name: Warn Sound
                  desc: Target-side lock warning cue.
                  icon: BIG_DRIPLEAF
                value:
                  type: SOUND
                  default: [true, block.big_dripleaf.place, 0.6, 1.0]
          - cooldown_sound:
              value: [true, item.crossbow.loading_start, 1.0, 0.8]
              def:
                meta:
                  name: Cooldown Sound
                  desc: Reloading wait cue.
                  icon: CLOCK
                value:
                  type: SOUND
                  default: [true, item.crossbow.loading_start, 1.0, 0.8]
behavior:
  main:
    runs-on:
      - INTERVAL
    options:
      interval-settings:
        interval: 0.25
        behavior: PER_INVOKE
    commands:
      player:
        # Role gate: spectators (null role) never snipe.
        - '<lf:mine,<prole:<p>>>'
        - '<if:"<lf:mine> == null","exit">'
        - '<runblock:tick>'
  tick:
    # Called-only: one sniper's full poll. Same executor (<p>) and
    # interval step (<args:0>) as main; <lf> re-derives below.
    commands:
      player:
        # Aim edge: raising the scope during cooldown shows the wait.
        - '<lf:mine,<prole:<p>>>'
        - '<lf:aiming,<pisusinghanditem:<p>,spyglass>>'
        - '<lf:cd,<pcooldown.get:<p>,snipe-<id>,5>>'
        - '<lf:rose,<if:"<lf:aiming> == true and <default:<pf:wasaiming-<id>>,false> != true",true,false>>'
        - '<if:"<lf:rose> == true and <lf:cd> gt 0","<runblock:coolmsg>">'
        - '<pf:wasaiming-<id>,<lf:aiming>>'
        # Current target first: sticky until it exits or resolves.
        - '<lf:t,<default:<pf:target-<id>>,none>>'
        - '<if:"<lf:t> != none","<runblock:hold>">'
        - '<if:"<lf:t> != none","exit">'
        # No target: cooldown and scope gates, then scan the foe list.
        # First valid candidate wins; later ones see the pick.
        - '<if:"<lf:cd> gt 0","exit">'
        - '<if:"<lf:aiming> != true","exit">'
        - '<lf:foe,<if:"<lf:mine> == HUNTER",SPEEDRUNNER,HUNTER>>'
        - '<for:<active-players:<lf:foe>>,<runblock:scan,<i>>>'
  scan:
    # Called-only: try one foe (<args:0>). Skips fast on the cheap
    # gates (health, range) before the raycast (plos angle).
    commands:
      player:
        - '<if:"<default:<pf:target-<id>>,none> != none","exit">'
        - '<if:"0 ge <pstat:<args:0>,health>","exit">'
        - '<lf:d,<vec.dist:<ploc:<p>>,<ploc:<args:0>>>>'
        - '<if:"<lf:d> lt <setting:sniper.min_distance>","exit">'
        - '<lf:ang,<min:<r2d:<arctan:0.2*<setting:sniper.leniency>/<lf:d>>>,7>>'
        - '<if:"<plos:<p>,<args:0>,180,<lf:ang>> != true","exit">'
        # Acquired: drop any stale claim, queue behind the holders,
        # then stake the track. First holder warns the target.
        - '<if:"<len:<gf:holders-<id>-<args:0>>> gt 0","<list.remove:<gf:holders-<id>-<args:0>>,<p>>">'
        - '<lf:n,<len:<gf:holders-<id>-<args:0>>>>'
        - '<if:"<lf:n> == 0","<gf:holders-<id>-<args:0>,[]>">'
        - '<list.append:<gf:holders-<id>-<args:0>>,<p>>'
        - '<pf:target-<id>,<args:0>>'
        - '<pf:progress-<id>,0>'
        - '<if:"<setting:sniper.glow> == true","<run:effect give <args:0> minecraft:glowing <ceil:<setting:sniper.lock_time>>>">'
        - '<if:"<lf:n> == 0","<runblock:warnnext,<args:0>,<p>>">'
        - '<pmsg:<p>,[<setting:messages.locked_message>,Tracking <args:0>... hold steady!]>'
        - '<psound:<p>,<setting:sounds.locked_sound>>'
  hold:
    # Called-only: keep or end the current track. Same executor and
    # interval step as tick; the target re-reads from <pf>.
    commands:
      player:
        - '<lf:t,<pf:target-<id>>>'
        # Gone: offline, swapped sides, or dead. Silent end.
        - '<lf:foe,<if:"<prole:<p>> == HUNTER",SPEEDRUNNER,HUNTER>>'
        - '<if:"<prole:<lf:t>> != <lf:foe>","<runblock:endtrack,gone>">'
        - '<if:"<prole:<lf:t>> != <lf:foe>","exit">'
        - '<if:"0 ge <pstat:<lf:t>,health>","<runblock:endtrack,gone>">'
        - '<if:"0 ge <pstat:<lf:t>,health>","exit">'
        # Aim lost: scope down, too close, or angle broken. Loud end.
        - '<if:"<pisusinghanditem:<p>,spyglass> != true","<runblock:endtrack,fail>">'
        - '<if:"<pisusinghanditem:<p>,spyglass> != true","exit">'
        - '<lf:d,<vec.dist:<ploc:<p>>,<ploc:<lf:t>>>>'
        - '<if:"<lf:d> lt <setting:sniper.min_distance>","<runblock:endtrack,fail>">'
        - '<if:"<lf:d> lt <setting:sniper.min_distance>","exit">'
        - '<lf:ang,<min:<r2d:<arctan:0.2*<setting:sniper.leniency>/<lf:d>>>,7>>'
        - '<if:"<plos:<p>,<lf:t>,180,<lf:ang>> != true","<runblock:endtrack,fail>">'
        - '<if:"<plos:<p>,<lf:t>,180,<lf:ang>> != true","exit">'
        # Holding: bank the interval step, resolve at lock_time.
        - '<lf:prog,<default:<pf:progress-<id>>,0>>'
        - '<pf:progress-<id>,<sum:<lf:prog>+<args:0>>>'
        - '<if:"<pf:progress-<id>> ge <setting:sniper.lock_time>","<runblock:resolve>">'
  resolve:
    # Called-only: the channel finished; branch on the outcome.
    commands:
      player:
        - '<lf:t,<pf:target-<id>>>'
        - '<if:"<setting:sniper.outcome> == KILL","<runblock:reskill>">'
        - '<if:"<setting:sniper.outcome> == KILL","exit">'
        - '<run:damage <lf:t> <setting:sniper.damage_amount> minecraft:arrow>'
        - '<if:"0 ge <pstat:<lf:t>,health>","<runblock:reskill>">'
        - '<if:"0 ge <pstat:<lf:t>,health>","exit">'
        - '<pmsg:<p>,[<setting:messages.snipe_damage_message>,You hit <lf:t> for <setting:sniper.damage_amount>!]>'
        - '<psound:<p>,<setting:sounds.snipe_damage_sound>>'
        - '<runblock:endtrack,done>'
  reskill:
    # Called-only: finishing hit. DAMAGE lands here only after a
    # lethal hit (no second kill); KILL lands here directly.
    commands:
      player:
        - '<lf:t,<pf:target-<id>>>'
        - '<if:"<setting:sniper.outcome> == KILL","<run:kill <lf:t>>">'
        - '<pmsg:<p>,[<setting:messages.snipe_kill_message>,You sniped <lf:t>!]>'
        - '<psound:<p>,<setting:sounds.snipe_kill_sound>>'
        - '<runblock:endtrack,done>'
  endtrack:
    # Called-only: release the track (<args:0> is fail, done, or
    # gone). Promotes the next queued holder with a fresh warning,
    # then stamps the 5s re-lock cooldown.
    commands:
      player:
        - '<lf:t,<pf:target-<id>>>'
        - '<list.remove:<gf:holders-<id>-<lf:t>>,<p>>'
        - '<lf:next,<list.first:<gf:holders-<id>-<lf:t>>>>'
        - '<if:"<lf:next> != null and <lf:next> != <p>","<runblock:warnnext,<lf:t>,<lf:next>>">'
        - '<pf:target-<id>,none>'
        - '<pf:progress-<id>,0>'
        - '<pcooldown:<p>,snipe-<id>,5>'
        - '<if:"<args:0> == fail","<pmsg:<p>,[<setting:messages.fail_message>,Lost the lock on <lf:t>!]>" >'
        - '<if:"<args:0> == fail","<psound:<p>,<setting:sounds.fail_sound>>">'
        - '<if:"<args:0> == done","<pmsg:<p>,[<setting:messages.cooldown_message>,Reloading: 5.0s. Hold your scope steady.]>" >'
        - '<if:"<args:0> == done","<psound:<p>,<setting:sounds.cooldown_sound>>">'
  warnnext:
    # Called-only: warn a target (<args:0>) about a sniper (<args:1>).
    commands:
      player:
        - '<if:"<setting:sniper.warn_target> != true","exit">'
        - '<if:"<setting:sniper.show_sniper_name> == true","<pmsg:<args:0>,[<setting:messages.warn_message>,<args:1> is locking onto you! Hide!]>" >'
        - '<if:"<setting:sniper.show_sniper_name> != true","<pmsg:<args:0>,[<setting:messages.warn_message>,A sniper is locking onto you! Hide!]>" >'
        - '<psound:<args:0>,<setting:sounds.warn_sound>>'
  coolmsg:
    # Called-only: reloading wait with one decimal left.
    commands:
      player:
        - '<lf:cd,<pcooldown.get:<p>,snipe-<id>,5>>'
        - '<pmsg:<p>,[<setting:messages.cooldown_message>,Reloading: <sum:<round:<lf:cd>*10>/10>s! Hold your scope steady.]>'
        - '<psound:<p>,<setting:sounds.cooldown_sound>>'
  give_start:
    runs-on:
      - ON_START
    commands:
      player:
        - 'give <p> spyglass[enchantments={"unbreaking":10},custom_name={"italic":false,"text":"Sniper Rifle"}] 1'
  give_respawn:
    runs-on:
      - ON_RESPAWN
    commands:
      player:
        - 'give <p> spyglass[enchantments={"unbreaking":10},custom_name={"italic":false,"text":"Sniper Rifle"}] 1'
