    # Interval driver: refreshes progress, applies roster eligibility, checks cards,
    # and broadcasts on the configured cooldown.
  eligibility:
    runs-on:
    - INTERVAL
    on-start: null
    options:
      interval-settings:
        interval: 8.0
        deviation: 2.0
        behavior: PER_INVOKE
      success-chance: null
      execution: null
      delay: null
    commands:
      console:
      # Wait until opening finishes after every headstart.
      - '<if:"<gflag:bingo:opened> != true","exit">'
      - <runblock:select-card>
        # Rebuild shared progress counters and pending item displays before checking cards.
      - <if:"<gflag:bingo:cardkind:SPEEDRUNNER> == shared","<gflag:bingo:SPEEDRUNNER:prog:craft,0><gflag:bingo:SPEEDRUNNER:prog:mine,0><gflag:bingo:SPEEDRUNNER:prog:adv,0>">
      - <if:"<gflag:bingo:cardkind:HUNTER> == shared","<gflag:bingo:HUNTER:prog:craft,0><gflag:bingo:HUNTER:prog:mine,0><gflag:bingo:HUNTER:prog:adv,0>">
      - <for:<range:0,<default:<gflag:bingo:SPEEDRUNNER:slots>,0>>,<if:"<gflag:bingo:cardkind:SPEEDRUNNER>
        == shared and <gflag:bingo:SPEEDRUNNER:kind:<i>> == item and <gflag:bingo:SPEEDRUNNER:done:<i>>
        != true","<gflag:bingo:SPEEDRUNNER:show:<i>,0>">>
      - <for:<range:0,<default:<gflag:bingo:HUNTER:slots>,0>>,<if:"<gflag:bingo:cardkind:HUNTER>
        == shared and <gflag:bingo:HUNTER:kind:<i>> == item and <gflag:bingo:HUNTER:done:<i>>
        != true","<gflag:bingo:HUNTER:show:<i>,0>">>
        # Snapshot idle once per member so repeated reads during the interval agree.
        # Cards whose player-count minima are no longer met complete automatically.
      - <for:<active-players:ALL>,<gflag:bingo:idle:<i>,<pstate:<i>,IDLE>>>
      - <lf:sown,<len:<active-players:SPEEDRUNNER>>>
      - <lf:hown,<len:<active-players:HUNTER>>>
      - <for:<range:0,<default:<gflag:bingo:SPEEDRUNNER:slots>,0>>,<if:"<gflag:bingo:SPEEDRUNNER:done:<i>>
        != true and (<gflag:bingo:SPEEDRUNNER:minown:<i>> gt <lf:sown> or <gflag:bingo:SPEEDRUNNER:minfoes:<i>>
        gt <lf:hown>)","<runblock:announce-slot,SPEEDRUNNER,<i>,SPEEDRUNNER>">>
      - <for:<range:0,<default:<gflag:bingo:HUNTER:slots>,0>>,<if:"<gflag:bingo:HUNTER:done:<i>>
        != true and (<gflag:bingo:HUNTER:minown:<i>> gt <lf:hown> or <gflag:bingo:HUNTER:minfoes:<i>>
        gt <lf:sown>)","<runblock:announce-slot,HUNTER,<i>,HUNTER>">>
      - <for:<active-players:ALL>,<if:"<gflag:bingo:cardkind:<prole:<i>>> == solo","<runblock:minima-solo,<i>>">>
      - <runblock:refresh-players>
      - <runblock:refresh-teams>
      - <for:<active-players:ALL>,<if:"<gflag:bingo:cardkind:<prole:<i>>> == solo","<runblock:check-holder,<i>,<args:0>>">>
      - <for:<active-players:ALL>,<if:"<gflag:bingo:cardkind:<prole:<i>>> == shared
        and <i> == <list.get:<active-players:<prole:<i>>>,0>","<runblock:check-holder,<i>,<args:0>>">>
        # Broadcast only after the configured cooldown; completions still announce immediately.
      - <if:"<sum:<gstat:duration>-<gflag:bingo:lastcast>> ge <setting:match.gap>","<gflag:bingo:lastcast,<gstat:duration>><runblock:broadcast>">
    # Called-only: completes dealt solo slots whose live player-count minima no longer hold.
  minima-solo:
    runs-on: null
    on-start: null
    options: null
    commands:
      console:
      - <lf:holder,<args:0>>
      - <lf:team,<prole:<lf:holder>>>
      - <lf:opp,<if:"<lf:team> == HUNTER",SPEEDRUNNER,HUNTER>>
      - <lf:ownlive,<len:<active-players:<lf:team>>>>
      - <lf:foelive,<len:<active-players:<lf:opp>>>>
      - <for:<range:0,<default:<gflag:bingo:<lf:holder>:slots>,0>>,<if:"<gflag:bingo:<lf:holder>:done:<i>>
        != true and (<gflag:bingo:<lf:holder>:minown:<i>> gt <lf:ownlive> or <gflag:bingo:<lf:holder>:minfoes:<i>>
        gt <lf:foelive>)","<runblock:announce-slot,<lf:holder>,<i>,<lf:holder>>">>
    # Called-only: marks holder <args:0> slot <args:1> done for player <args:2>,
    # announces once, then checks the win. Completed counters are pinned to the target.
  announce-slot:
    runs-on: null
    on-start: null
    options: null
    commands:
      console:
      - <lf:holder,<args:0>>
      - <lf:slot,<args:1>>
      - <lf:who,<args:2>>
      - <if:"<list.contains:<range:0,<default:<gflag:bingo:<lf:holder>:slots>,0>>,<lf:slot>>
        != true","exit">
      - <if:"<gflag:bingo:<lf:holder>:done:<lf:slot>> == true","exit">
      - <gflag:bingo:<lf:holder>:done:<lf:slot>,true>
      - <gflag:bingo:<lf:holder>:show:<lf:slot>,<gflag:bingo:<lf:holder>:need:<lf:slot>>>
      - <gflag:bingo:<lf:holder>:donecount,<sum:<default:<gflag:bingo:<lf:holder>:donecount>,0>+1>>
      - <lf:team,<if:"<lf:holder> == HUNTER or <lf:holder> == SPEEDRUNNER",<lf:holder>,<prole:<lf:holder>>>>
      - <gmsg:<rcolor:<lf:team>><lf:who> \<#<setting:messages.normal>\>completed <modcolor><gflag:bingo:<lf:holder>:desc:<lf:slot>>>
      - <gsound:entity.player.levelup,1,1>
      - <runblock:win-check,<lf:holder>>
    # Called-only: checks a completed card against the current mode win condition.
    # Teams-solo counts finishers per team; other completed cards win immediately.
  win-check:
    runs-on: null
    on-start: null
    options: null
    commands:
      console:
      - <lf:holder,<args:0>>
