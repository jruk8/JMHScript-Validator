# Bingo supports solo cards, individual team cards, and shared team cards,
# with configurable win thresholds and roster-based task eligibility.
# Players complete randomized item, action, combat, and teamwork tasks;
# progress is announced, and meeting the mode win condition wins for
# the team. Reloads re-deal cards, while roster changes can auto-complete
# tasks whose player-count requirements are no longer met.
enabled: true
meta:
  name: Bingo
  description: Complete a task card to win the game for your team (v1.0)
  icon: MAP
  author: DaVeltto
  visibility:
    icon: MAP
    color: fce6a9
    broadcast: true
config:
  settings:
    match:
      def:
        meta:
          name: Match
          desc: Card mode, win threshold, and announcement pacing.
          icon: TARGET
        folder:
          - mode:
              value: solo
              def:
                meta:
                  name: Mode
                  desc: Card mode. Anything but the two teams modes reads as solo.
                  icon: MAP
                value:
                  type: ENUM
                  default: solo
                  allowed: [solo, teams-solo, teams-shared]
          - pct:
              value: 70
              def:
                meta:
                  name: Finisher Percent
                  desc: Teams-solo finisher percentage for each team, 1 to 100.
                  icon: GOLD_INGOT
                value:
                  type: INTEGER
                  default: 70
                  allowed:
                    min: 1
                    max: 100
          - gap:
              value: 60
              def:
                meta:
                  name: Broadcast Gap
                  desc: Seconds between progress announcements.
                  icon: BELL
                value:
                  type: INTEGER
                  default: 60
                  allowed:
                    min: 5
                    max: 3600
    messages:
      def:
        meta:
          name: Messages
          desc: Message colors. The accent comes from the modifier color.
          icon: WHITE_DYE
        folder:
          - normal:
              value: fffbf0
              def:
                meta:
                  name: Normal
                  desc: Off-accent text color for card messages.
                  icon: WHITE_DYE
                value:
                  type: COLOR
                  default: fffbf0
    card:
      def:
        meta:
          name: Card
          desc: Tasks per category on each dealt card.
          icon: WRITTEN_BOOK
        folder:
          - easycount:
              value: 2
              def:
                meta:
                  name: Easy Tasks
                  desc: Easy item tasks per card.
                  icon: DIRT
                value:
                  type: INTEGER
                  default: 2
                  allowed:
                    min: 0
                    max: 25
          - midcount:
              value: 1
              def:
                meta:
                  name: Mid Tasks
                  desc: Mid item tasks per card.
                  icon: IRON_INGOT
                value:
                  type: INTEGER
                  default: 1
                  allowed:
                    min: 0
                    max: 25
          - hardcount:
              value: 0
              def:
                meta:
                  name: Hard Tasks
                  desc: Hard item tasks per card.
                  icon: DIAMOND
                value:
                  type: INTEGER
                  default: 0
                  allowed:
                    min: 0
                    max: 25
          - actioncount:
              value: 1
              def:
                meta:
                  name: Action Tasks
                  desc: Action tasks per card.
                  icon: FEATHER
                value:
                  type: INTEGER
                  default: 1
                  allowed:
                    min: 0
                    max: 25
          - specialcount:
              value: 1
              def:
                meta:
                  name: Special Tasks
                  desc: Special tasks per card.
                  icon: NETHER_STAR
                value:
                  type: INTEGER
                  default: 1
                  allowed:
                    min: 0
                    max: 25
          - dynacount:
              value: 1
              def:
                meta:
                  name: Dynamic Tasks
                  desc: Role dynamic tasks per card.
                  icon: COMPASS
                value:
                  type: INTEGER
                  default: 1
                  allowed:
                    min: 0
                    max: 25
          - sharedcount:
              value: 1
              def:
                meta:
                  name: Shared Tasks
                  desc: Shared team tasks per card. Solo cards force this to zero at deal time.
                  icon: PLAYER_HEAD
                value:
                  type: INTEGER
                  default: 1
                  allowed:
                    min: 0
                    max: 25
behavior:
  main:
    runs-on:
    - ON_START
    on-start: null
    options: null
    commands:
      console:
        # Task pools use [key, need, description, minown, minfoes] quintuples.
        # Keep keys and needs comma-free; descriptions may use color escapes.
      - <gflag:bingo:pool:items-easy,[[spruce_log,6,Gather <modcolor>Spruce Logs\<#<setting:messages.normal>\>,1,1],[dirt,128,Gather
        <modcolor>Dirt\<#<setting:messages.normal>\>,1,1],[oak_leaves,32,Gather <modcolor>Oak Leaves\<#<setting:messages.normal>\>,1,1],[birch_log,6,Gather
        <modcolor>Birch Logs\<#<setting:messages.normal>\>,1,1],[terracotta,12,Gather <modcolor>Terracotta\<#<setting:messages.normal>\>,1,1],[water_bucket,1,Fetch
        a <modcolor>Water Bucket\<#<setting:messages.normal>\>,1,1],[lava_bucket,1,Fetch a <modcolor>Lava
        Bucket\<#<setting:messages.normal>\>,1,1],[sand,64,Gather <modcolor>Sand\<#<setting:messages.normal>\>,1,1],[gravel,64,Gather
        <modcolor>Gravel\<#<setting:messages.normal>\>,1,1],[sugar_cane,16,Gather <modcolor>Sugar Cane\<#<setting:messages.normal>\>,1,1],[bone,8,Collect
        <modcolor>Bones\<#<setting:messages.normal>\>,1,1],[string,8,Collect <modcolor>String\<#<setting:messages.normal>\>,1,1],[feather,8,Collect
        <modcolor>Feathers\<#<setting:messages.normal>\>,1,1],[lily_pad,1,Fetch a <modcolor>Lily Pad\<#<setting:messages.normal>\>,1,1]]>
      - <gflag:bingo:pool:items-mid,[[obsidian,2,Gather <modcolor>Obsidian\<#<setting:messages.normal>\>,1,1],[diamond,2,Gather
        <modcolor>Diamonds\<#<setting:messages.normal>\>,1,1],[emerald,2,Gather <modcolor>Emeralds\<#<setting:messages.normal>\>,1,1],[golden_apple,1,Fetch
        a <modcolor>Golden Apple\<#<setting:messages.normal>\>,1,1],[amethyst_shard,8,Gather <modcolor>Amethyst
        Shards\<#<setting:messages.normal>\>,1,1],[basalt,32,Gather <modcolor>Basalt\<#<setting:messages.normal>\>,1,1],[honey_bottle,2,Fetch
        <modcolor>Honey Bottles\<#<setting:messages.normal>\>,1,1],[ender_pearl,1,Fetch an <modcolor>Ender
        Pearl\<#<setting:messages.normal>\>,1,1],[powder_snow_bucket,1,Fetch a <modcolor>Powder Snow
        Bucket\<#<setting:messages.normal>\>,1,1],[cyan_glazed_terracotta,4,Gather <modcolor>Cyan Glazed
        Terracotta\<#<setting:messages.normal>\>,1,1],[red_glazed_terracotta,4,Gather <modcolor>Red
        Glazed Terracotta\<#<setting:messages.normal>\>,1,1],[yellow_glazed_terracotta,4,Gather <modcolor>Yellow
        Glazed Terracotta\<#<setting:messages.normal>\>,1,1],[pink_glazed_terracotta,4,Gather <modcolor>Pink
        Glazed Terracotta\<#<setting:messages.normal>\>,1,1]]>
      - <gflag:bingo:pool:items-hard,[[blaze_rod,4,Collect <modcolor>Blaze Rods\<#<setting:messages.normal>\>,1,1],[nether_wart,24,Gather
        <modcolor>Nether Wart\<#<setting:messages.normal>\>,1,1],[quartz,32,Gather <modcolor>Quartz\<#<setting:messages.normal>\>,1,1],[magma_block,32,Gather
        <modcolor>Magma Blocks\<#<setting:messages.normal>\>,1,1],[soul_soil,32,Gather <modcolor>Soul
        Soil\<#<setting:messages.normal>\>,1,1],[magma_cream,8,Collect <modcolor>Magma Cream\<#<setting:messages.normal>\>,1,1],[ghast_tear,1,Fetch
        a <modcolor>Ghast Tear\<#<setting:messages.normal>\>,1,1],[ancient_debris,1,Fetch <modcolor>Ancient
        Debris\<#<setting:messages.normal>\>,1,1],[pufferfish_bucket,1,Fetch a <modcolor>Pufferfish
        Bucket\<#<setting:messages.normal>\>,1,1],[axolotl_bucket,1,Fetch an <modcolor>Axolotl Bucket\<#<setting:messages.normal>\>,1,1]]>
      - <gflag:bingo:pool:actions,[[sneak,120,<modcolor>Sneak\<#<setting:messages.normal>\> for 120s,1,1],[sprint,120,<modcolor>Sprint\<#<setting:messages.normal>\>
        for 120s,1,1],[swim,120,<modcolor>Swim\<#<setting:messages.normal>\> for 120s,1,1],[idle,120,<modcolor>Idle\<#<setting:messages.normal>\>
        for 120s,1,1],[below0,120,Spend 120s <modcolor>below Y=0\<#<setting:messages.normal>\>,1,1],[below40,120,Spend
        120s <modcolor>below Y=40\<#<setting:messages.normal>\>,1,1],[above100,120,Spend 120s <modcolor>above
        Y=100\<#<setting:messages.normal>\>,1,1],[nosprint,300,Do not <modcolor>sprint\<#<setting:messages.normal>\> for
        5 minutes,1,1],[nowater,300,Stay <modcolor>out of water\<#<setting:messages.normal>\> for 5
        minutes,1,1],[abovey50,480,Stay <modcolor>above Y=50\<#<setting:messages.normal>\> for 8 minutes,1,1],[craft,120,<modcolor>Craft\<#<setting:messages.normal>\>
        120 times,1,1],[mine,300,<modcolor>Mine\<#<setting:messages.normal>\> 300 blocks,1,1],[adv,8,Gain
        8 <modcolor>Advancements\<#<setting:messages.normal>\>,1,1],[damage,20,Deal <modcolor>10 hearts\<#<setting:messages.normal>\>
        of damage,1,1],[npcpair,15,<modcolor>Follow\<#<setting:messages.normal>\> a teammate closely
        for 15s,2,1]]>
      - <gflag:bingo:pool:specials,[[yhi,320,Reach <modcolor>Y level 320\<#<setting:messages.normal>\>,1,1],[ylo,62,Reach
        <modcolor>Y level -62\<#<setting:messages.normal>\>,1,1],[nodmg,300,Take <modcolor>no damage\<#<setting:messages.normal>\>
        for 5 minutes,1,1],[mobkill,10,Kill 10 <modcolor>hostile mobs\<#<setting:messages.normal>\>,1,1],[killcreeper,3,Kill
        3 <modcolor>Creepers\<#<setting:messages.normal>\>,1,1],[killzombie,5,Kill 5 <modcolor>Zombies\<#<setting:messages.normal>\>,1,1],[killenderman,1,Kill
        an <modcolor>Enderman\<#<setting:messages.normal>\>,1,1],[killfriendly,15,Kill 15 <modcolor>friendly
        mobs\<#<setting:messages.normal>\>,1,1],[hitfoe,50,Hit an enemy <modcolor>50 times\<#<setting:messages.normal>\>,1,1],[hurttaken,20,Take
        <modcolor>10 hearts\<#<setting:messages.normal>\> of damage,1,1],[hurtfall,1,Take <modcolor>fall
        damage\<#<setting:messages.normal>\>,1,1],[hurtarrow,1,Get hit by <modcolor>an arrow\<#<setting:messages.normal>\>,1,1]]>
      - <gflag:bingo:pool:dyn-hunter,[[hitrun10,10,Hit a runner <modcolor>10 times\<#<setting:messages.normal>\>,1,1],[hitrunfar,1,Hit
        a runner <modcolor>from 20 blocks away\<#<setting:messages.normal>\>,1,1],[hitrunswim,1,Hit
        a runner <modcolor>who is swimming\<#<setting:messages.normal>\>,1,1],[halfruns,1,Tag <modcolor>half
        the runners\<#<setting:messages.normal>\> at least once,1,1],[stalklurk,3,Stay <modcolor>idle\<#<setting:messages.normal>\>
        by a runner for 3s,1,1],[near10,60,<modcolor>Shadow\<#<setting:messages.normal>\> a runner for
        60s,1,1],[near3,30,Stay <modcolor>face to face\<#<setting:messages.normal>\> with an enemy for
        30s,1,1]]>
      - <gflag:bingo:pool:dyn-runner,[[hithunt15,15,Hit a hunter <modcolor>15 times\<#<setting:messages.normal>\>,1,1],[hithuntfar,1,Hit
        a hunter <modcolor>from 20 blocks away\<#<setting:messages.normal>\>,1,1],[killhunt1,1,Kill
        a <modcolor>hunter\<#<setting:messages.normal>\>,1,1],[halfhunts,1,Tag <modcolor>most hunters\<#<setting:messages.normal>\>
        at least once,1,1],[lurkerhide,10,Stay <modcolor>idle\<#<setting:messages.normal>\> by a hunter
        for 10s,1,1],[far150,300,Stay <modcolor>150 blocks\<#<setting:messages.normal>\> from all hunters
        for 5 minutes,1,1],[near3,30,Stay <modcolor>face to face\<#<setting:messages.normal>\> with
        an enemy for 30s,1,1]]>
      - <gflag:bingo:pool:shared-hunter,[[ditch,1,Get <modcolor>ditched\<#<setting:messages.normal>\>
        in a fight,2,1],[surround,1,Corner an enemy <modcolor>as a team\<#<setting:messages.normal>\>,2,1],[dimspread,2,Split
        across <modcolor>two dimensions\<#<setting:messages.normal>\>,2,1],[ritual,20,<modcolor>Crouch
        together\<#<setting:messages.normal>\> for 20s,2,1],[conga,10,Follow the teammate <modcolor>ahead\<#<setting:messages.normal>\>
        for 10s,2,1]]>
      - <gflag:bingo:pool:shared-runner,[[lonewolf,1,Kill a hunter with <modcolor>no
        teammate near\<#<setting:messages.normal>\>,2,1],[overpower,1,Kill a hunter while your own team
        <modcolor>hits you\<#<setting:messages.normal>\>,3,1],[twounique,2,<modcolor>Two different
        runners\<#<setting:messages.normal>\> score kills,2,1],[surround,1,Corner an enemy <modcolor>as
        a team\<#<setting:messages.normal>\>,2,1],[dimspread,2,Split across <modcolor>two dimensions\<#<setting:messages.normal>\>,2,1],[ritual,20,<modcolor>Crouch
        together\<#<setting:messages.normal>\> for 20s,2,1],[conga,10,Follow the teammate <modcolor>ahead\<#<setting:messages.normal>\>
        for 10s,2,1]]>
# Match state: broadcast interval and timestamp, placement order, and per-team finisher counts.
# Mode, finisher percent, and broadcast gap are admin knobs in config.settings above.
      - <gflag:bingo:lastcast,0>
      - <gflag:bingo:finorder,0>
      - <gflag:bingo:fincount:HUNTER,0>
      - <gflag:bingo:fincount:SPEEDRUNNER,0>
      - <runblock:select-card>
    # Static active-modifier line at /manhunt start; it does not read mode, so block order cannot matter.
  opening:
    runs-on:
    - ON_START
    on-start:
      pre-start-order: AFTER
    options: null
    commands:
      console:
      - <runblock:select-card>
      - <runblock:broadcast>
      - <gflag:bingo:opened,true>
    # Called-only: keeps card kinds sticky, then deals each missing holder for a fresh match or reload.
  select-card:
    runs-on: null
    on-start: null
    options: null
    commands:
      console:
        # Reload recovery: rebuild pool data when initialization state is absent.
      - <if:"<gflag:bingo:pool:items-easy> == null","<runblock:main>">
        # Shared cards require teams-shared mode and at least two live players on that team.
      - <lf:ckh,<if:"<setting:match.mode> == teams-shared and <len:<active-players:HUNTER>>
        ge 2",shared,solo>>
      - <lf:ckr,<if:"<setting:match.mode> == teams-shared and <len:<active-players:SPEEDRUNNER>>
        ge 2",shared,solo>>
        # Card kinds are selected once per team and remain fixed for the match.
      - <if:"<gflag:bingo:cardkind:HUNTER> == null","<gflag:bingo:cardkind:HUNTER,<lf:ckh>>">
      - <if:"<gflag:bingo:cardkind:SPEEDRUNNER> == null","<gflag:bingo:cardkind:SPEEDRUNNER,<lf:ckr>>">
      - <for:<active-players:ALL>,<if:"<gflag:bingo:cardkind:<prole:<i>>> == solo
        and <gflag:bingo:<i>:slots> == null","<runblock:deal-holder,<i>>">>
      - <if:"<gflag:bingo:cardkind:SPEEDRUNNER> == shared and <gflag:bingo:SPEEDRUNNER:slots>
        == null","<runblock:deal-holder,SPEEDRUNNER>">
      - <if:"<gflag:bingo:cardkind:HUNTER> == shared and <gflag:bingo:HUNTER:slots>
        == null","<runblock:deal-holder,HUNTER>">
    # Called-only: deals one card for holder <args:0>, a player or team.
    # Pools shuffle per holder; role pools follow the holder team and minima filter entries first.
  deal-holder:
    runs-on: null
    on-start: null
    options: null
    commands:
      console:
      - <lf:holder,<args:0>>
      - <lf:team,<if:"<lf:holder> == HUNTER or <lf:holder> == SPEEDRUNNER",<lf:holder>,<prole:<lf:holder>>>>
      - <lf:opp,<if:"<lf:team> == HUNTER",SPEEDRUNNER,HUNTER>>
      - <lf:ownlive,<len:<active-players:<lf:team>>>>
      - <lf:foelive,<len:<active-players:<lf:opp>>>>
        # Deal knobs come from config.settings above; solo cards
        # force sharedcount to zero on the next line.
      - <lf:easycount,<setting:card.easycount>>
      - <lf:midcount,<setting:card.midcount>>
      - <lf:hardcount,<setting:card.hardcount>>
      - <lf:actioncount,<setting:card.actioncount>>
      - <lf:specialcount,<setting:card.specialcount>>
      - <lf:dynacount,<setting:card.dynacount>>
      - <lf:sharedcount,<setting:card.sharedcount>>
      - <if:"<gflag:bingo:cardkind:<lf:team>> == solo","<lf:sharedcount,0>">
      - <lf:card,[]>
      - <lf:rest,[]>
        # Minima filters keep entries out when live player counts are too low.
      - <lf:f_specials,[]>
      - <for:<gflag:bingo:pool:specials>,<if:"<list.get:<i>,3> le <lf:ownlive> and
        <list.get:<i>,4> le <lf:foelive>","<list.append:<lf:f_specials>,<i>>">>
      - <lf:f_dyn-hunter,[]>
      - <for:<gflag:bingo:pool:dyn-hunter>,<if:"<list.get:<i>,3> le <lf:ownlive> and
        <list.get:<i>,4> le <lf:foelive>","<list.append:<lf:f_dyn-hunter>,<i>>">>
      - <lf:f_dyn-runner,[]>
      - <for:<gflag:bingo:pool:dyn-runner>,<if:"<list.get:<i>,3> le <lf:ownlive> and
        <list.get:<i>,4> le <lf:foelive>","<list.append:<lf:f_dyn-runner>,<i>>">>
      - <lf:f_shared-hunter,[]>
      - <for:<gflag:bingo:pool:shared-hunter>,<if:"<list.get:<i>,3> le <lf:ownlive>
        and <list.get:<i>,4> le <lf:foelive>","<list.append:<lf:f_shared-hunter>,<i>>">>
      - <lf:f_shared-runner,[]>
      - <for:<gflag:bingo:pool:shared-runner>,<if:"<list.get:<i>,3> le <lf:ownlive>
        and <list.get:<i>,4> le <lf:foelive>","<list.append:<lf:f_shared-runner>,<i>>">>
        # Route dynamic and shared pools by the card holder team.
      - <lf:dyn,<if:"<lf:team> == HUNTER",<lf:f_dyn-hunter>,<lf:f_dyn-runner>>>
      - <lf:sh,<if:"<lf:team> == HUNTER",<lf:f_shared-hunter>,<lf:f_shared-runner>>>
      - <list.shuffle:<gflag:bingo:pool:items-easy>>
      - <list.shuffle:<gflag:bingo:pool:items-mid>>
      - <list.shuffle:<gflag:bingo:pool:items-hard>>
      - <list.shuffle:<gflag:bingo:pool:actions>>
      - <list.shuffle:<lf:f_specials>>
      - <list.shuffle:<lf:dyn>>
      - <list.shuffle:<lf:sh>>
      - <for:<list.slice:<gflag:bingo:pool:items-easy>,0,<lf:easycount>>,<list.append:<lf:card>,[item-<list.get:<i>,0>-<list.get:<i>,1>,
        <list.get:<i>,2>, item, <list.get:<i>,3>, <list.get:<i>,4>]>>
      - <for:<list.slice:<gflag:bingo:pool:items-mid>,0,<lf:midcount>>,<list.append:<lf:card>,[item-<list.get:<i>,0>-<list.get:<i>,1>,
        <list.get:<i>,2>, item, <list.get:<i>,3>, <list.get:<i>,4>]>>
      - <for:<list.slice:<gflag:bingo:pool:items-hard>,0,<lf:hardcount>>,<list.append:<lf:card>,[item-<list.get:<i>,0>-<list.get:<i>,1>,
        <list.get:<i>,2>, item, <list.get:<i>,3>, <list.get:<i>,4>]>>
      - <for:<list.slice:<gflag:bingo:pool:actions>,0,<lf:actioncount>>,<list.append:<lf:card>,[act-<list.get:<i>,0>-<list.get:<i>,1>,
        <list.get:<i>,2>, <list.get:<i>,0>, <list.get:<i>,3>, <list.get:<i>,4>]>>
      - <for:<list.slice:<lf:f_specials>,0,<lf:specialcount>>,<list.append:<lf:card>,[sp-<list.get:<i>,0>-<list.get:<i>,1>,
        <list.get:<i>,2>, <list.get:<i>,0>, <list.get:<i>,3>, <list.get:<i>,4>]>>
      - <for:<list.slice:<lf:dyn>,0,<lf:dynacount>>,<list.append:<lf:card>,[dyn-<list.get:<i>,0>-<list.get:<i>,1>,
        <list.get:<i>,2>, <list.get:<i>,0>, <list.get:<i>,3>, <list.get:<i>,4>]>>
      - <for:<list.slice:<lf:sh>,0,<lf:sharedcount>>,<list.append:<lf:card>,[sh-<list.get:<i>,0>-<list.get:<i>,1>,
        <list.get:<i>,2>, <list.get:<i>,0>, <list.get:<i>,3>, <list.get:<i>,4>]>>
        # Count category shortfalls so the card can be topped up from shuffled leftovers.
      - <lf:takeeasy,<len:<list.slice:<gflag:bingo:pool:items-easy>,0,<lf:easycount>>>>
      - <lf:takemid,<len:<list.slice:<gflag:bingo:pool:items-mid>,0,<lf:midcount>>>>
      - <lf:takehard,<len:<list.slice:<gflag:bingo:pool:items-hard>,0,<lf:hardcount>>>>
      - <lf:takeacts,<len:<list.slice:<gflag:bingo:pool:actions>,0,<lf:actioncount>>>>
      - <lf:takespecs,<len:<list.slice:<lf:f_specials>,0,<lf:specialcount>>>>
      - <lf:takedyn,<len:<list.slice:<lf:dyn>,0,<lf:dynacount>>>>
      - <lf:takesh,<len:<list.slice:<lf:sh>,0,<lf:sharedcount>>>>
      - <lf:short,<sum:(<lf:easycount>-<lf:takeeasy>)+(<lf:midcount>-<lf:takemid>)+(<lf:hardcount>-<lf:takehard>)+(<lf:actioncount>-<lf:takeacts>)+(<lf:specialcount>-<lf:takespecs>)+(<lf:dynacount>-<lf:takedyn>)+(<lf:sharedcount>-<lf:takesh>)>>
      - <for:<list.slice:<gflag:bingo:pool:items-easy>,<lf:easycount>,999>,<list.append:<lf:rest>,[item-<list.get:<i>,0>-<list.get:<i>,1>,
        <list.get:<i>,2>, item, <list.get:<i>,3>, <list.get:<i>,4>]>>
      - <for:<list.slice:<gflag:bingo:pool:items-mid>,<lf:midcount>,999>,<list.append:<lf:rest>,[item-<list.get:<i>,0>-<list.get:<i>,1>,
        <list.get:<i>,2>, item, <list.get:<i>,3>, <list.get:<i>,4>]>>
      - <for:<list.slice:<gflag:bingo:pool:items-hard>,<lf:hardcount>,999>,<list.append:<lf:rest>,[item-<list.get:<i>,0>-<list.get:<i>,1>,
        <list.get:<i>,2>, item, <list.get:<i>,3>, <list.get:<i>,4>]>>
      - <for:<list.slice:<gflag:bingo:pool:actions>,<lf:actioncount>,999>,<list.append:<lf:rest>,[act-<list.get:<i>,0>-<list.get:<i>,1>,
        <list.get:<i>,2>, <list.get:<i>,0>, <list.get:<i>,3>, <list.get:<i>,4>]>>
      - <for:<list.slice:<lf:f_specials>,<lf:specialcount>,999>,<list.append:<lf:rest>,[sp-<list.get:<i>,0>-<list.get:<i>,1>,
        <list.get:<i>,2>, <list.get:<i>,0>, <list.get:<i>,3>, <list.get:<i>,4>]>>
      - <for:<list.slice:<lf:dyn>,<lf:dynacount>,999>,<list.append:<lf:rest>,[dyn-<list.get:<i>,0>-<list.get:<i>,1>,
        <list.get:<i>,2>, <list.get:<i>,0>, <list.get:<i>,3>, <list.get:<i>,4>]>>
