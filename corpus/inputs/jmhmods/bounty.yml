behavior:
  main:
    runs-on:
      - INTERVAL
    options:
      interval-settings:
        # Expiry granularity. Offer waves ride gstat:duration math
        # below, so this only sets how promptly waves and expiries
        # land; a higher value is cheaper.
        interval: 5
        behavior: PER_INVOKE
    commands:
      console:
        # Tunables live in config.settings above. Marks last 180
        # seconds; offers land about every interval seconds with the
        # configured spread. Expiry is fixed, cadence is tunable.
        # ---- Functions ----
        # sched: next offer time = now + interval +/- deviation.
        - '<def:sched,<gf:bounty-next,<ceil:<lf:now>+<random-num:<lf:lo>,<lf:hi>>>>>'
        # ---- Clock and rosters ----
        - '<lf:now,<gstat:duration>>'
        - '<lf:ah,<active-players:HUNTER>>'
        - '<lf:ar,<active-players:SPEEDRUNNER>>'
        - '<lf:nh,<len:<lf:ah>>>'
        - '<lf:nr,<len:<lf:ar>>>'
        - '<lf:th,<default:<gf:bounty-th>,[]>>'
        - '<lf:tr,<default:<gf:bounty-tr>,[]>>'
        - '<lf:xh,<default:<gf:bounty-xh>,[]>>'
        - '<lf:xr,<default:<gf:bounty-xr>,[]>>'
        - '<lf:mn,\<#<setting:messages.normal>\>>'
        # ---- Revalidate: expired, shrunk, gone, or out ----
        # Marks survive only while unexpired, on a team of two or
        # more, held by an active member who is still in. Drops land
        # in the shared gone bucket for one expire announce.
        - '<lf:gone,[]>'
        - '<lf:keep,[]><lf:keepx,[]>'
        - '<for:<range:0,<len:<lf:th>>>,<lf:nm,<list.get:<lf:th>,<i>>><lf:xp,<list.get:<lf:xh>,<i>>><lf:ok,<if:"<lf:xp> gt <lf:now> and <lf:nh> gt 1 and <list.contains:<lf:ah>,<lf:nm>> == true and <peliminated:<lf:nm>> != true",true,false>><if:"<lf:ok> == true","<list.append:<lf:keep>,<lf:nm>><list.append:<lf:keepx>,<lf:xp>>","<list.append:<lf:gone>,<lf:nm>>">>'
        - '<lf:th,<lf:keep>><lf:xh,<lf:keepx>>'
        - '<gf:bounty-th,<lf:th>><gf:bounty-xh,<lf:xh>>'
        - '<lf:keep,[]><lf:keepx,[]>'
        - '<for:<range:0,<len:<lf:tr>>>,<lf:nm,<list.get:<lf:tr>,<i>>><lf:xp,<list.get:<lf:xr>,<i>>><lf:ok,<if:"<lf:xp> gt <lf:now> and <lf:nr> gt 1 and <list.contains:<lf:ar>,<lf:nm>> == true and <peliminated:<lf:nm>> != true",true,false>><if:"<lf:ok> == true","<list.append:<lf:keep>,<lf:nm>><list.append:<lf:keepx>,<lf:xp>>","<list.append:<lf:gone>,<lf:nm>>">>'
        - '<lf:tr,<lf:keep>><lf:xr,<lf:keepx>>'
        - '<gf:bounty-tr,<lf:tr>><gf:bounty-xr,<lf:xr>>'
        # One expire announce per poll, however many marks dropped.
        # Glow clears always run so a dropped mark never stays lit.
        - '<if:"<len:<lf:gone>> gt 0","<for:<lf:gone>,<run:effect clear <i> minecraft:glowing>>">'
        - '<if:"<len:<lf:gone>> gt 0","<gmsg:[true,\<newline\>\<bold\>Bounty\</bold\> on <s.lformat:<lf:gone>,\<white\>> expired with no rewards.]>">'
        - '<if:"<len:<lf:gone>> gt 0","<gsound:<setting:sounds.expire>>">'
        # ---- Offer wave ----
        - '<lf:lo,<ceil:<setting:targeting.interval>-<setting:targeting.deviation>>>'
        - '<lf:hi,<ceil:<setting:targeting.interval>+<setting:targeting.deviation>>>'
        - '<if:"<default:<gf:bounty-next>,none> == none","<sched>">'
        - '<lf:due,<if:"<lf:now> ge <default:<gf:bounty-next>,0>",true,false>>'
        # Fresh pools exclude already-marked players, so waves never
        # stack a second mark on anyone.
        - '<lf:ph,[]>'
        - '<for:<lf:ah>,<if:"<list.contains:<lf:th>,<i>> != true","<list.append:<lf:ph>,<i>>">>'
        - '<lf:pr,[]>'
        - '<for:<lf:ar>,<if:"<list.contains:<lf:tr>,<i>> != true","<list.append:<lf:pr>,<i>>">>'
        # Floor of share times members, minimum one; teams of one
        # yield nothing until they grow mid match.
        - '<lf:ch,<if:"<lf:nh> gt 1","<max:<floor:<lf:nh>*<setting:targeting.hunter_pct>/100>,1>",0>>'
        - '<lf:cr,<if:"<lf:nr> gt 1","<max:<floor:<lf:nr>*<setting:targeting.runner_pct>/100>,1>",0>>'
        - '<list.shuffle:<lf:ph>>'
        - '<list.shuffle:<lf:pr>>'
        - '<lf:newh,<list.slice:<lf:ph>,0,<lf:ch>>>'
        - '<lf:newr,<list.slice:<lf:pr>,0,<lf:cr>>>'
        - '<lf:any,<if:"<len:<lf:newh>> gt 0 or <len:<lf:newr>> gt 0",true,false>>'
        # Waves never overlap: a new wave fires only on a clear
        # board, so one round fully settles before the next begins.
        - '<lf:clear,<if:"<len:<lf:th>> == 0 and <len:<lf:tr>> == 0",true,false>>'
        - '<lf:wave,<if:"<lf:due> == true and <lf:any> == true and <lf:clear> == true",true,false>>'
        # The wave opens the round with a 180s fuse each.
        - '<if:"<lf:wave> == true","<for:<lf:newh>,<list.append:<lf:th>,<i>><list.append:<lf:xh>,<sum:<lf:now>,180>>>">'
        - '<if:"<lf:wave> == true","<for:<lf:newr>,<list.append:<lf:tr>,<i>><list.append:<lf:xr>,<sum:<lf:now>,180>>>">'
        - '<if:"<lf:wave> == true","<gf:bounty-th,<lf:th>><gf:bounty-xh,<lf:xh>><gf:bounty-tr,<lf:tr>><gf:bounty-xr,<lf:xr>><gf:bounty-warned,false>">'
        - '<if:"<lf:wave> == true and <setting:rules.glow> == true","<for:<lf:newh>,<peffect:<i>,[[glowing,0,180]]>>">'
        - '<if:"<lf:wave> == true and <setting:rules.glow> == true","<for:<lf:newr>,<peffect:<i>,[[glowing,0,180]]>>">'
        # One message per side (one prefix each): your marks to
        # protect, the other side to hunt. Names wear role colors.
        - '<lf:hp,"<if:"<len:<lf:newh>> gt 0","<lf:mn>» <s.lformat:<lf:newh>,<rcolor:HUNTER>>","<lf:mn>» None">">'
        - '<lf:hh,"<if:"<len:<lf:newr>> gt 0","<lf:mn>» <s.lformat:<lf:newr>,<rcolor:SPEEDRUNNER>>","<lf:mn>» None">">'
        - '<lf:hm,"\<newline\>\<bold\>Bounty\</bold\>\<newline\><modcolor>**--**--**--**--**--**--**\<newline\><rcolor:HUNTER>Protect:\<newline\><lf:hp>\<newline\>\<newline\><rcolor:HUNTER>Hitlist:\<newline\><lf:hh>\<newline\><modcolor>**--**--**--**--**--**--**\<newline\>Deliver within \<white\>180\</white\> seconds for rewards.\<newline\>">'
        - '<lf:rp,"<if:"<len:<lf:newr>> gt 0","<lf:mn>» <s.lformat:<lf:newr>,<rcolor:SPEEDRUNNER>>","<lf:mn>» None">">'
        - '<lf:rh,"<if:"<len:<lf:newh>> gt 0","<lf:mn>» <s.lformat:<lf:newh>,<rcolor:HUNTER>>","<lf:mn>» None">">'
        - '<lf:rm,"\<newline\>\<bold\>Bounty\</bold\>\<newline\><modcolor>**--**--**--**--**--**--**\<newline\><rcolor:SPEEDRUNNER>Protect:\<newline\><lf:rp>\<newline\>\<newline\><rcolor:SPEEDRUNNER>Hitlist:\<newline\><lf:rh>\<newline\><modcolor>**--**--**--**--**--**--**\<newline\>Deliver within \<white\>180\</white\> seconds for rewards.\<newline\>">'
        - '<if:"<lf:wave> == true","<rmsg:HUNTER,[true,<lf:hm>]>">'
        - '<if:"<lf:wave> == true","<rmsg:SPEEDRUNNER,[true,<lf:rm>]>">'
        - '<if:"<lf:wave> == true","<gsound:<setting:sounds.offer>>">'
        # Each new mark hears they are hunted. The wave reschedules
        # even when empty or blocked so small lobbies never spam polls.
        - '<lf:newt,[]><for:<lf:newh>,<list.append:<lf:newt>,<i>>><for:<lf:newr>,<list.append:<lf:newt>,<i>>>'
        - '<lf:selfmsg,\<newline\>A \<bold\>bounty\</bold\> hangs over you! Survive \<white\>180\</white\> seconds!>'
        - '<if:"<lf:wave> == true","<for:<lf:newt>,<pmsg:<i>,[true,<lf:selfmsg>]><psound:<i>,<setting:sounds.assigned>>>">'
        - '<if:"<lf:due> == true","<sched>">'
        # ---- Final-minute call ----
        # Once per round, when live marks exist and the latest
        # expiry drops under a minute out. The wave clears the
        # latch when the next round opens.
        - '<lf:wmax,0>'
        - '<for:<lf:xh>,<if:"<i> gt <lf:wmax>","<lf:wmax,<i>>">>'
        - '<for:<lf:xr>,<if:"<i> gt <lf:wmax>","<lf:wmax,<i>>">>'
        - '<if:"<len:<lf:th>>+<len:<lf:tr>> gt 0 and <lf:wmax>-<lf:now> lt 60 and <default:<gf:bounty-warned>,false> != true","<gmsg:[true,\<newline\>\<bold\>Bounty\</bold\> ends in under a minute!]><gf:bounty-warned,true><gsound:<setting:sounds.warn>>">'
        # Glow refresh: milk or rival mods can strip the outline, so
        # live marks relight every poll while the toggle holds.
        - '<if:"<setting:rules.glow> == true","<for:<lf:th>,<peffect:<i>,[[glowing,0,180]]>>">'
        - '<if:"<setting:rules.glow> == true","<for:<lf:tr>,<peffect:<i>,[[glowing,0,180]]>>">'
  on-death:
    runs-on:
      - ON_DEATH
    commands:
      console:
        # <args:0> victim, <args:1> killer or null, <args:2>
        # victim role. Non-marks leave quietly; marks route to
        # friendly, environmental, or enemy handling.
        - '<lf:victim,<args:0>><lf:killer,<args:1>><lf:vrole,<args:2>>'
        - '<lf:th,<default:<gf:bounty-th>,[]>><lf:tr,<default:<gf:bounty-tr>,[]>>'
        - '<lf:istarget,<if:"<list.contains:<lf:th>,<lf:victim>> == true or <list.contains:<lf:tr>,<lf:victim>> == true",true,false>>'
        - '<if:"<lf:istarget> != true","exit">'
        - '<lf:krole,<if:"<lf:killer> != null",<prole:<lf:killer>>,NONE>>'
        - '<lf:friendly,<if:"<lf:killer> != null and <lf:krole> == <lf:vrole>",true,false>>'
        - '<lf:opp,<if:"<lf:vrole> == HUNTER",SPEEDRUNNER,HUNTER>>'
        # Own mark killed: punishment replaces the whole kill flow
        # (no rewards, no elimination, no victim song).
        - '<if:"<lf:friendly> == true","<runblock:fire-friendly,<lf:victim>,<lf:killer>,<lf:vrole>>">'
        - '<if:"<lf:friendly> == true","exit">'
        # No killer and env kills off: the mark just ends, expire
        # style, with no rewards and no punishment.
        - '<if:"<lf:killer> == null and <setting:rules.env_kills> != true","<runblock:drop-target,<lf:victim>>">'
        - '<if:"<lf:killer> == null and <setting:rules.env_kills> != true","<gmsg:[true,\<newline\>\<bold\>Bounty\</bold\> on <s.lformat:[<lf:victim>],\<white\>> ended with no rewards.]>">'
        - '<if:"<lf:killer> == null and <setting:rules.env_kills> != true","<gsound:<setting:sounds.expire>>">'
        - '<if:"<lf:killer> == null and <setting:rules.env_kills> != true","exit">'
        # No killer and env kills on: the wild claims for the other
        # team (team rewards only, no killer extras).
        - '<if:"<lf:killer> == null","<runblock:pay-kill,<lf:victim>,null,<lf:opp>,<lf:vrole>,The wild,true>>">'
        - '<if:"<lf:killer> == null","exit">'
        # Enemy claim: full team plus killer rewards.
        - '<runblock:pay-kill,<lf:victim>,<lf:killer>,<lf:krole>,<lf:vrole>,<lf:killer>,true>'
  on-disconnect:
    runs-on:
      - ON_DISCONNECT
    commands:
      console:
        # <args:0> quitter, <args:1> quitter role. A mark who leaves
        # counts as claimed by the other team (team rewards only, no
        # killer extras, no victim feedback: they are offline).
        - '<lf:quitter,<args:0>><lf:qrole,<args:1>>'
        - '<lf:th,<default:<gf:bounty-th>,[]>><lf:tr,<default:<gf:bounty-tr>,[]>>'
        - '<lf:istarget,<if:"<list.contains:<lf:th>,<lf:quitter>> == true or <list.contains:<lf:tr>,<lf:quitter>> == true",true,false>>'
        - '<if:"<lf:istarget> != true","exit">'
        - '<lf:opp,<if:"<lf:qrole> == HUNTER",SPEEDRUNNER,HUNTER>>'
        - '<runblock:pay-kill,<lf:quitter>,null,<lf:opp>,<lf:qrole>,Cowardice,false>'
  pay-kill:
    # Called-only: pays one claim. Args: victim, killer or null,
    # paid role, victim role, no-killer who-label, victim feedback.
    commands:
      console:
        - '<lf:victim,<args:0>><lf:killer,<args:1>><lf:krole,<args:2>><lf:vrole,<args:3>><lf:fb,<args:5>>'
        - '<runblock:drop-target,<lf:victim>>'
        # Eliminated reads when the toggle forces it or the engine
        # lives count already took them out.
        - '<lf:verb,<if:"<setting:rules.eliminate> == true or <peliminated:<lf:victim>> == true",eliminated,delivered>>'
        - '<lf:mates,<if:"<lf:krole> == HUNTER",<active-players:HUNTER>,<active-players:SPEEDRUNNER>>>'
        - '<lf:mn,\<#<setting:messages.normal>\>>'
        # Halves double via sum (there is no product tag).
        - '<lf:thalf,<sum:<setting:team_stats.hearts>,<setting:team_stats.hearts>>>'
        - '<lf:khalf,<sum:<setting:killer_stats.hearts>,<setting:killer_stats.hearts>>>'
        # Weighted draws, unique, clamped to the table when short.
        - '<lf:gpicks,<weighted-picks:<setting:team_groceries.list>,<setting:team_groceries.count>,true>>'
        - '<lf:epicks,<weighted-picks:<setting:team_effects.list>,<setting:team_effects.count>,true>>'
        - '<lf:kpicks,<weighted-picks:<setting:killer_groceries.list>,<setting:killer_groceries.count>,true>>'
        - '<lf:keffects,<weighted-picks:<setting:killer_effects.list>,<setting:killer_effects.count>,true>>'
        # Killer buff rolls once, up front; team buffs roll per head
        # inside the message sweep below.
        - '<lf:khit,<if:"<lf:killer> != null and <random-num:1,100> le <setting:killer_stats.chance>",true,false>>'
        - '<if:"<lf:khit> == true","<pmaxhp.modify:<lf:killer>,<id>,<lf:khalf>>">'
        # Team groceries: one extract plus one fanned give per pick
        # slot (eight covers the max count; short tables skip).
        - '<lf:t0,<list.get:<lf:gpicks>,0>>'
        - '<if:"<len:<lf:gpicks>> gt 0","<for:<lf:mates>,<run:give <i> <list.get:<lf:t0>,0> <random-num:<list.get:<lf:t0>,1>,<list.get:<lf:t0>,2>>>>">'
        - '<lf:t1,<list.get:<lf:gpicks>,1>>'
        - '<if:"<len:<lf:gpicks>> gt 1","<for:<lf:mates>,<run:give <i> <list.get:<lf:t1>,0> <random-num:<list.get:<lf:t1>,1>,<list.get:<lf:t1>,2>>>>">'
        - '<lf:t2,<list.get:<lf:gpicks>,2>>'
        - '<if:"<len:<lf:gpicks>> gt 2","<for:<lf:mates>,<run:give <i> <list.get:<lf:t2>,0> <random-num:<list.get:<lf:t2>,1>,<list.get:<lf:t2>,2>>>>">'
        - '<lf:t3,<list.get:<lf:gpicks>,3>>'
        - '<if:"<len:<lf:gpicks>> gt 3","<for:<lf:mates>,<run:give <i> <list.get:<lf:t3>,0> <random-num:<list.get:<lf:t3>,1>,<list.get:<lf:t3>,2>>>>">'
        - '<lf:t4,<list.get:<lf:gpicks>,4>>'
        - '<if:"<len:<lf:gpicks>> gt 4","<for:<lf:mates>,<run:give <i> <list.get:<lf:t4>,0> <random-num:<list.get:<lf:t4>,1>,<list.get:<lf:t4>,2>>>>">'
        - '<lf:t5,<list.get:<lf:gpicks>,5>>'
        - '<if:"<len:<lf:gpicks>> gt 5","<for:<lf:mates>,<run:give <i> <list.get:<lf:t5>,0> <random-num:<list.get:<lf:t5>,1>,<list.get:<lf:t5>,2>>>>">'
        - '<lf:t6,<list.get:<lf:gpicks>,6>>'
        - '<if:"<len:<lf:gpicks>> gt 6","<for:<lf:mates>,<run:give <i> <list.get:<lf:t6>,0> <random-num:<list.get:<lf:t6>,1>,<list.get:<lf:t6>,2>>>>">'
        - '<lf:t7,<list.get:<lf:gpicks>,7>>'
        - '<if:"<len:<lf:gpicks>> gt 7","<for:<lf:mates>,<run:give <i> <list.get:<lf:t7>,0> <random-num:<list.get:<lf:t7>,1>,<list.get:<lf:t7>,2>>>>">'
        # Killer groceries ride one sweep over the picks.
        - '<if:"<lf:killer> != null","<for:<lf:kpicks>,<run:give <lf:killer> <list.get:<i>,0> <random-num:<list.get:<i>,1>,<list.get:<i>,2>>>>">'
        # Effects apply as whole lists: role-wide, then the killer.
        - '<if:"<len:<lf:epicks>> gt 0","<reff:<lf:krole>,<lf:epicks>>">'
        - '<if:"<lf:killer> != null and <len:<lf:keffects>> gt 0","<peffect:<lf:killer>,<lf:keffects>>">'
        # Reward names: ids with spaces instead of underscores.
        - '<lf:gnames,[]><for:<lf:gpicks>,<list.append:<lf:gnames>,<str.join:<str.split:<list.get:<i>,0>,_>," ">>>'
        - '<lf:enames,[]><for:<lf:epicks>,<list.append:<lf:enames>,<str.join:<str.split:<list.get:<i>,0>,_>," ">>>'
        - '<lf:knames,[]><for:<lf:kpicks>,<list.append:<lf:knames>,<str.join:<str.split:<list.get:<i>,0>,_>," ">>>'
        - '<lf:kenames,[]><for:<lf:keffects>,<list.append:<lf:kenames>,<str.join:<str.split:<list.get:<i>,0>,_>," ">>>'
        # Killer section, built only when a killer exists so empty
        # tables never warn down the killerless paths.
        - '<if:"<lf:killer> != null","<lf:kblock,"\<newline\><lf:mn>» Killer items: <s.lformat:<lf:knames>,\<white\>><lf:mn>.\<newline\><lf:mn>» Killer effects: <s.lformat:<lf:kenames>,\<white\>><lf:mn>.<if:''<lf:khit> == true'',''\<newline\><lf:mn>» \<red\>You gained \<white\><floor:<lf:khalf>/2> hearts\</white\>!''>">">'
        # One message per head (one prefix each): names the claimer
        # or YOU, rolls that head buff, then plays that head sound
        # (killers hear only their own).
        - '<for:<lf:mates>,<lf:who,<lf:killer>><if:"<lf:killer> == null","<lf:who,<args:4>>"><if:"<i> == <lf:killer>","<lf:who,YOU>"><lf:hit,<if:"<random-num:1,100> le <setting:team_stats.chance>",true,false>><if:"<lf:hit> == true","<pmaxhp.modify:<i>,<id>,<lf:thalf>>"><lf:msg,"\<newline\>\<bold\><lf:who>\</bold\> <lf:verb> <rcolor:<lf:vrole>><lf:victim><modcolor>!\<newline\><lf:mn>» Items: <s.lformat:<lf:gnames>,\<white\>><lf:mn>.\<newline\><lf:mn>» Effects: <s.lformat:<lf:enames>,\<white\>><lf:mn>.<if:"<lf:hit> == true","\<newline\><lf:mn>» \<red\>You gained \<white\><floor:<lf:thalf>/2> hearts\</white\>!"><if:"<i> == <lf:killer>","<lf:kblock>">"><pmsg:<i>,[true,<lf:msg>]><psound:<i>,<if:"<i> == <lf:killer>",<setting:sounds.killer_kill>,<setting:sounds.team_kill>>>>'
        # The mark hears their bounty fall, where feedback applies.
        - '<lf:whoall,<if:"<lf:killer> != null",<lf:killer>,<args:4>>>'
        - '<if:"<lf:fb> == true","<pmsg:<lf:victim>,[true,\<newline\>Your \<bold\>bounty\</bold\> was claimed by \<white\><lf:whoall>\</white\>!]>">'
        - '<if:"<lf:fb> == true","<psound:<lf:victim>,<setting:sounds.slain>>">'
        # Elimination runs last so rewards and words land first.
        - '<if:"<setting:rules.eliminate> == true","<loseplayer:<lf:victim>,Bounty claimed>">'
  fire-friendly:
    # Called-only: punishes an own-mark kill. Args: victim,
    # killer, victim role. No rewards and no elimination here.
    commands:
      console:
        - '<lf:victim,<args:0>><lf:killer,<args:1>><lf:vrole,<args:2>>'
        - '<lf:other,<if:"<lf:vrole> == HUNTER",SPEEDRUNNER,HUNTER>>'
        - '<runblock:drop-target,<lf:victim>>'
        - '<if:"<setting:rules.friendly_fire> == LOSE_MATCH","<if:''<lf:other> == HUNTER'',''<win:HUNTER,Bounty betrayal>'',''<win:SPEEDRUNNER,Bounty betrayal>''>">'
        - '<if:"<setting:rules.friendly_fire> != LOSE_MATCH","<if:''<lf:vrole> == HUNTER'',''<runblock:wipe-hunters>'',''<runblock:wipe-runners>''>">'
        - '<if:"<setting:rules.friendly_fire> == LOSE_MATCH","<gmsg:[true,\<newline\>\<bold\>Bounty betrayal!\</bold\> \<white\><lf:killer>\</white\> slew their own mark \<white\><lf:victim>\</white\>! The match is forfeit.]>">'
        - '<if:"<setting:rules.friendly_fire> != LOSE_MATCH","<gmsg:[true,\<newline\>\<bold\>Bounty betrayal!\</bold\> \<white\><lf:killer>\</white\> slew their own mark \<white\><lf:victim>\</white\>! Team armor wiped.]>">'
        - '<gsound:<setting:sounds.friendly>>'
  drop-target:
    # Called-only: clears one mark from both sides and strips its
    # glow. Args: victim.
    commands:
      console:
        - '<lf:victim,<args:0>>'
        - '<lf:th,<default:<gf:bounty-th>,[]>><lf:tr,<default:<gf:bounty-tr>,[]>>'
        - '<lf:xh,<default:<gf:bounty-xh>,[]>><lf:xr,<default:<gf:bounty-xr>,[]>>'
        - '<lf:nth,[]><lf:nxh,[]>'
        - '<for:<range:0,<len:<lf:th>>>,<if:"<list.get:<lf:th>,<i>> != <lf:victim>","<list.append:<lf:nth>,<list.get:<lf:th>,<i>>><list.append:<lf:nxh>,<list.get:<lf:xh>,<i>>>">>'
        - '<gf:bounty-th,<lf:nth>><gf:bounty-xh,<lf:nxh>>'
        - '<lf:nth,[]><lf:nxh,[]>'
        - '<for:<range:0,<len:<lf:tr>>>,<if:"<list.get:<lf:tr>,<i>> != <lf:victim>","<list.append:<lf:nth>,<list.get:<lf:tr>,<i>>><list.append:<lf:nxh>,<list.get:<lf:xr>,<i>>>">>'
        - '<gf:bounty-tr,<lf:nth>><gf:bounty-xr,<lf:nxh>>'
        - '<run:effect clear <lf:victim> minecraft:glowing>'
  wipe-hunters:
    # Called-only: strips worn armor from every hunter. Static team
    # selectors fan out per member at dispatch.
    commands:
      console:
        - 'item replace entity @a[team=hunter] armor.head with air'
        - 'item replace entity @a[team=hunter] armor.chest with air'
        - 'item replace entity @a[team=hunter] armor.legs with air'
        - 'item replace entity @a[team=hunter] armor.feet with air'
  wipe-runners:
    # Called-only: strips worn armor from every runner.
    commands:
      console:
        - 'item replace entity @a[team=speedrunner] armor.head with air'
        - 'item replace entity @a[team=speedrunner] armor.chest with air'
        - 'item replace entity @a[team=speedrunner] armor.legs with air'
        - 'item replace entity @a[team=speedrunner] armor.feet with air'
  player-cleanup:
    commands:
      player:
        - '<pmaxhp.clear:<p>,<id>>'
