                  name: Hunter Percent
                  desc: Share of hunters marked per wave, minimum one. Teams of one yield no targets.
                  icon: DIAMOND_SWORD
                value:
                  type: INTEGER
                  default: 20
                  allowed:
                    min: 0
                    max: 100
          - runner_pct:
