# Bounty: wave-based hunt contracts on a percentage of each team.
# One shared INTERVAL poll offers waves, expires old marks, and
# revalidates (shrink, eliminate, and disconnect paths all clear
# through here or the event blocks; nobody stays glowing forever).
# Kills settle in on-death, quits in on-disconnect, and both pay
# through the shared pay-kill block. Team groceries ride vanilla
# give lines (one per pick index, fanned out per teammate); killer
# groceries ride one for over the picks. State flags: bounty-th /
# bounty-tr target names, bounty-xh / bounty-xr parallel expiries
# (match seconds), bounty-next next offer time, bounty-warned
# final-minute latch.
enabled: false
meta:
  name: "Bounty"
  description: "Hunt marked players for team and killer rewards (v1.0)"
  icon: NAME_TAG
  author: DaVeltto
  visibility:
    icon: NAME_TAG
    color: ff7a38
    broadcast: true
config:
  settings:
    targeting:
      def:
        meta:
          name: Targeting
          desc: Offer cadence and per-side target share.
          icon: CLOCK
        folder:
          - interval:
              value: 90
              def:
                meta:
                  name: Interval
                  desc: Average seconds between offer waves.
                  icon: CLOCK
                value:
                  type: INTEGER
                  default: 90
                  allowed:
                    min: 10
                    max: 3600
          - deviation:
              value: 30
              def:
                meta:
                  name: Deviation
                  desc: Random spread in seconds around the interval. Keep smaller than the interval.
                  icon: CLOCK
                value:
                  type: INTEGER
                  default: 30
                  allowed:
                    min: 0
                    max: 600
          - hunter_pct:
              value: 20
